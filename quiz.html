<!DOCTYPE html>
<html>
<head>
<title>✦ How Well Do You Know Us? ✦ </title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<style>
* {
margin:0;
padding:0;
box-sizing:border-box;
}

body {
background:linear-gradient(145deg, #120a18 0%, #231523 50%, #13231f 100%);
font-family:'Georgia', 'Times New Roman', serif;
min-height:100vh;
padding:12px;
color:#f5e6ff;
position:relative;
overflow-x:hidden;
}

/* Particle container */
#particle-container {
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:1000;
}

.particle {
position:absolute;
font-size:24px;
animation:floatToHeart 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
z-index:1000;
filter:drop-shadow(0 0 5px gold);
}

@keyframes floatToHeart {
0% {
    transform:translate(0, 0) scale(1) rotate(0deg);
    opacity:1;
}
70% {
    opacity:0.8;
}
100% {
    transform:translate(var(--tx), var(--ty)) scale(0) rotate(360deg);
    opacity:0;
}
}

/* Heart animations */
@keyframes heartBeat {
0% { transform:scale(1); }
25% { transform:scale(1.2); filter:drop-shadow(0 0 25px #ff69b4); }
50% { transform:scale(1); }
75% { transform:scale(1.1); filter:drop-shadow(0 0 15px #ff69b4); }
100% { transform:scale(1); }
}

@keyframes heartGlow {
0% { filter:drop-shadow(0 0 5px #ffb6c1); }
50% { filter:drop-shadow(0 0 25px #ff69b4); }
100% { filter:drop-shadow(0 0 5px #ffb6c1); }
}

.heart-pulse {
animation:heartBeat 0.6s ease-in-out;
}

.heart-glow {
animation:heartGlow 2s infinite;
}

/* Main container */
.quiz-container {
max-width:600px;
margin:0 auto;
position:relative;
z-index:10;
}

/* Header */
.header {
text-align:center;
padding:30px 15px 20px;
background:rgba(20,10,20,0.5);
backdrop-filter:blur(15px);
-webkit-backdrop-filter:blur(15px);
border-radius:40px 40px 30px 30px;
margin-bottom:20px;
border:1px solid rgba(255,182,193,0.25);
}

h1 {
font-size:38px;
font-weight:300;
background:linear-gradient(135deg, #ffdbeb, #ffb6c1, #6fcf97);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:8px;
font-family:'Playfair Display', 'Georgia', serif;
letter-spacing:1px;
}

.subtitle {
color:#c7a5c7;
font-size:14px;
letter-spacing:3px;
}

/* Progress bar - completely redesigned */
.progress-bar {
background:rgba(30,15,25,0.7);
backdrop-filter:blur(10px);
border-radius:60px;
padding:12px 18px;
margin:15px 0 20px;
display:flex;
align-items:center;
justify-content:space-between;
border:1px solid rgba(255,182,193,0.3);
}

.score-display {
display:flex;
align-items:center;
gap:12px;
}

.heart-mini {
font-size:32px;
position:relative;
display:inline-block;
}

.heart-fill-badge {
position:absolute;
top:-8px;
right:-8px;
background:#6fcf97;
color:#120a18;
border-radius:30px;
padding:3px 8px;
font-size:12px;
font-weight:bold;
border:1px solid #ffb6c1;
box-shadow:0 2px 8px rgba(0,0,0,0.3);
}

.flower-counter {
display:flex;
align-items:center;
gap:6px;
background:rgba(255,182,193,0.15);
padding:8px 15px;
border-radius:40px;
}

.flower-counter span {
font-size:22px;
}

.flower-count {
color:#6fcf97;
font-weight:bold;
font-size:18px;
margin-left:3px;
}

/* Question card */
.question-card {
background:rgba(25,15,22,0.75);
backdrop-filter:blur(15px);
-webkit-backdrop-filter:blur(15px);
border-radius:35px;
padding:28px 22px;
margin:20px 0;
border:1px solid rgba(255,182,193,0.25);
box-shadow:0 15px 30px rgba(0,0,0,0.5);
}

.question-number {
color:#6fcf97;
font-size:13px;
letter-spacing:2px;
margin-bottom:12px;
text-transform:uppercase;
}

.question-text {
font-size:22px;
color:#ffffff;
margin-bottom:25px;
line-height:1.4;
font-weight:300;
text-shadow:0 2px 5px rgba(0,0,0,0.3);
}

/* Options */
.options {
display:flex;
flex-direction:column;
gap:12px;
margin:20px 0;
}

.option {
background:rgba(255,182,193,0.08);
border:1px solid rgba(255,182,193,0.3);
border-radius:60px;
padding:16px 22px;
color:#ffffff;
font-size:17px;
cursor:pointer;
transition:all 0.2s;
display:flex;
align-items:center;
gap:15px;
backdrop-filter:blur(5px);
}

.option:active {
transform:scale(0.98);
background:rgba(111,207,151,0.15);
}

.option.selected {
background:rgba(111,207,151,0.2);
border-color:#6fcf97;
box-shadow:0 0 15px rgba(111,207,151,0.3);
}

.option-emoji {
font-size:26px;
width:40px;
text-align:center;
}

/* Input field */
.qa-input {
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,182,193,0.3);
border-radius:60px;
padding:16px 22px;
width:100%;
color:white;
font-size:17px;
margin:15px 0;
}

.qa-input:focus {
outline:none;
border-color:#6fcf97;
background:rgba(255,255,255,0.12);
}

.qa-input::placeholder {
color:rgba(255,255,255,0.3);
font-style:italic;
}

/* Feedback */
.feedback {
margin:15px 0 5px;
padding:12px;
border-radius:40px;
text-align:center;
font-size:16px;
font-weight:500;
}

.feedback.correct {
background:rgba(111,207,151,0.15);
border:1px solid #6fcf97;
color:#a5e0b5;
}

.feedback.incorrect {
background:rgba(255,100,100,0.15);
border:1px solid #ff8a8a;
color:#ffb6b6;
}

/* Match section */
.match-container {
display:flex;
flex-direction:column;
gap:18px;
margin:25px 0;
}

.match-row {
display:flex;
flex-direction:column;
gap:8px;
}

.match-event {
background:rgba(255,182,193,0.1);
padding:14px 18px;
border-radius:30px;
font-size:16px;
border-left:4px solid #ffb6c1;
}

.match-select {
width:100%;
padding:14px 18px;
border-radius:30px;
background:rgba(20,10,15,0.9);
border:1px solid rgba(255,182,193,0.3);
color:white;
font-size:16px;
cursor:pointer;
appearance:none;
background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23ffb6c1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
background-repeat:no-repeat;
background-position:right 18px center;
}

.match-select option {
background:#1a0f1c;
}

/* Private section */
.private-section {
background:rgba(111,207,151,0.08);
border:2px dashed #6fcf97;
border-radius:35px;
padding:25px;
margin:30px 0;
}

.private-title {
color:#6fcf97;
font-size:18px;
margin-bottom:20px;
text-align:center;
letter-spacing:2px;
}

/* Yes/No section */
.yes-no-container {
display:flex;
gap:15px;
justify-content:center;
margin:25px 0 15px;
}

.yes-btn, .no-btn {
flex:1;
padding:16px 0;
border-radius:60px;
font-size:20px;
cursor:pointer;
transition:all 0.2s;
border:none;
font-family:'Georgia', serif;
max-width:140px;
}

.yes-btn {
background:rgba(255,100,100,0.15);
border:1px solid #ff8a8a;
color:#ffb6b6;
}

.yes-btn:active {
background:rgba(255,100,100,0.3);
transform:scale(0.95);
}

.no-btn {
background:rgba(111,207,151,0.15);
border:1px solid #6fcf97;
color:#a5e0b5;
}

.no-btn:active {
background:rgba(111,207,151,0.3);
transform:scale(0.95);
}

.no-btn.selected {
background:#6fcf97;
color:#120a18;
border-color:#6fcf97;
}

.sad-emoji-container {
display:flex;
flex-wrap:wrap;
gap:8px;
justify-content:center;
margin:20px 0;
min-height:40px;
}

.sad-emoji {
font-size:28px;
animation:pop 0.3s;
}

@keyframes pop {
0% { transform:scale(0) rotate(0deg); }
80% { transform:scale(1.2) rotate(5deg); }
100% { transform:scale(1) rotate(0deg); }
}

/* Bouquet display */
.bouquet-display {
text-align:center;
padding:30px 20px;
background:rgba(0,0,0,0.3);
border-radius:50px;
margin:30px 0;
}

.bouquet {
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:12px;
font-size:48px;
animation:float 4s infinite ease-in-out;
}

@keyframes float {
0% { transform:translateY(0); }
50% { transform:translateY(-8px); }
100% { transform:translateY(0); }
}

/* Certificate */
.certificate {
background:linear-gradient(145deg, #251a25, #1a2a1f);
border:3px double #6fcf97;
border-radius:45px;
padding:40px 25px;
text-align:center;
margin:30px 0;
box-shadow:0 0 40px rgba(111,207,151,0.3);
}

.certificate h2 {
font-size:38px;
color:#ffb6c1;
margin-bottom:15px;
letter-spacing:2px;
}

.certificate-seal {
font-size:70px;
margin:20px;
filter:drop-shadow(0 0 15px gold);
}

.certificate-signature {
font-size:22px;
color:#6fcf97;
font-style:italic;
margin:25px 0;
}

.date-box {
background:rgba(255,255,255,0.05);
padding:12px 20px;
border-radius:60px;
display:inline-block;
margin:20px 0;
border:1px dashed #6fcf97;
}

.date-box span {
color:#ffb6c1;
font-size:18px;
}

/* Navigation */
.quiz-nav {
display:flex;
justify-content:space-between;
margin:20px 0 10px;
gap:10px;
}

.nav-btn {
background:rgba(255,182,193,0.1);
border:1px solid #ffb6c1;
color:#ffb6c1;
padding:14px 25px;
border-radius:50px;
cursor:pointer;
font-size:16px;
flex:1;
text-align:center;
transition:all 0.2s;
}

.nav-btn:active:not(:disabled) {
background:#ffb6c1;
color:#120a18;
transform:scale(0.97);
}

.nav-btn:disabled {
opacity:0.3;
border-color:rgba(255,182,193,0.2);
}

.submit-btn {
background:#6fcf97 !important;
color:#120a18 !important;
border:none !important;
font-weight:bold;
padding:16px 30px !important;
margin:20px auto !important;
display:block !important;
width:fit-content;
min-width:200px;
}

/* Hidden */
.hidden {
display:none !important;
}

/* Flower colors */
.flower-rose { color:#ff6b8b; text-shadow:0 0 10px #ff4d6d; }
.flower-jasmine { color:#fff2c0; text-shadow:0 0 10px #fff0b5; }
.flower-tulip { color:#ff9f7c; text-shadow:0 0 10px #ff8a5c; }

/* Mobile optimization */
@media (max-width:480px) {
body { padding:10px; }
h1 { font-size:32px; }
.question-card { padding:22px 18px; }
.question-text { font-size:20px; }
.option { padding:14px 18px; font-size:16px; }
.nav-btn { padding:12px 15px; font-size:15px; }
}

/* Success animation */
@keyframes bloom {
0% { transform:scale(0) rotate(0deg); opacity:0; }
100% { transform:scale(1) rotate(360deg); opacity:1; }
}
</style>
</head>
<body>

<div id="particle-container"></div>

<div class="quiz-container">
    
    <div class="header">
        <h1>✦ how well do you know us? ✦</h1>
        <div class="subtitle">for manahil · from salman</div>
    </div>
    
    <!-- New progress bar -->
    <div class="progress-bar">
        <div class="score-display">
            <div class="heart-mini">
                <span id="heartIcon" style="font-size:32px;">🤍</span>
                <span class="heart-fill-badge" id="heartBadge">0%</span>
            </div>
        </div>
        <div class="flower-counter">
            <span>🌸</span>
            <span class="flower-count" id="flowerCount">0</span>
            <span style="color:#ffb6c1;">/20</span>
        </div>
    </div>
    
    <div id="questionContainer"></div>
    
    <div class="quiz-nav">
        <button class="nav-btn" id="prevBtn" onclick="prevQuestion()" disabled>← back</button>
        <button class="nav-btn" id="nextBtn" onclick="nextQuestion()">next →</button>
    </div>
    
    <div id="certificateContainer" class="hidden"></div>
    
</div>

<script>
// =============================================
// QUIZ DATA
// =============================================

const quizData = [
    // Q1
    {
        type: "mcq",
        question: "When was Salman born?",
        options: [
            { text: "April 25, 2005", emoji: "🌹" },
            { text: "April 20, 2005", emoji: "🌸" },
            { text: "April 25, 2004", emoji: "🌺" },
            { text: "February 18, 2005", emoji: "🌷" }
        ],
        correct: 0
    },
    
    // Q2
    {
        type: "mcq",
        question: "When were you born?",
        options: [
            { text: "May 10, 2004", emoji: "🌸" },
            { text: "July 22, 2006", emoji: "🌹" },
            { text: "May 10, 2005", emoji: "🌺" },
            { text: "December 5, 2005", emoji: "🌷" }
        ],
        correct: 2
    },
    
    // Q3
    {
        type: "qa",
        question: "What date did you add Salman back on Snapchat? (DD Month YYYY)",
        correct: "14 August 2025",
        alternate: ["14th August 2025", "august 14 2025", "14 august 2025"]
    },
    
    // Q4
    {
        type: "qa",
        question: "When did you know you felt the same way for Salman? (include month, date, year and time, M/D/Y/T)",
        correct: "February 8, 2026, 3:00am",
        alternate: ["february 8 2026 3am", "8 feb 2026 3:00", "feb 8 2026 3am", "february 8 2026 3:00am"]
    },
    
    // Q5
    {
        type: "multiselect-all",
        question: "What are the nicknames Salman calls you?",
        options: [
            { text: "Rapunzel", emoji: "👸" },
            { text: "jaan", emoji: "💗" },
            { text: "love", emoji: "💕" },
            { text: "my lady", emoji: "👑" },
            { text: "my queen", emoji: "👸" }
        ],
        correct: [0, 1, 2, 3, 4]
    },
    
    // Q6
    {
        type: "mcq",
        question: "What character did you compare Salman to?",
        options: [
            { text: "Flynn Rider", emoji: "🦸" },
            { text: "Aladdin", emoji: "🧞" },
            { text: "Prince Charming", emoji: "🤴" },
            { text: "Hercules", emoji: "🏺" }
        ],
        correct: 0
    },
    
    // Q7
    {
        type: "multiselect-all",
        question: "What are your best features? (select all)",
        options: [
            { text: "Your eyes", emoji: "👀" },
            { text: "Your hair", emoji: "💇‍♀️" },
            { text: "Your smile", emoji: "😊" },
            { text: "Your laugh", emoji: "😂" },
            { text: "Your talks", emoji: "💬" },
            { text: "Your attitude", emoji: "🔥" }
        ],
        correct: [0, 1, 2, 3, 4, 5]
    },
    
    // Q8
    {
        type: "mcq",
        question: "When did you exchange numbers?",
        options: [
            { text: "June 2024", emoji: "☀️" },
            { text: "October 2023", emoji: "🍂" },
            { text: "March 2025", emoji: "🌸" },
            { text: "January 2024", emoji: "❄️" }
        ],
        correct: 0
    },
    
    // Q9
    {
        type: "qa",
        question: "Where did Salman move to in 2024?(Hint: 2 countries)",
        correct: "USA then Canada",
        alternate: ["usa then canada", "america then canada", "united states then canada", "us then canada"]
    },
    
    // Q10
    {
        type: "mcq",
        question: "How many km apart are you?",
        options: [
            { text: "12,000km", emoji: "🌎" },
            { text: "9,500km", emoji: "🌍" },
            { text: "14,200km", emoji: "🌏" },
            { text: "7,800km", emoji: "🌍" }
        ],
        correct: 0
    }
];

// =============================================
// MATCH SECTION
// =============================================
const matchData = [
    { event: "You first met", correct: "Age 3" },
    { event: "You exchanged numbers", correct: "June 2024" },
    { event: "Flynn Rider moment", correct: "January 27, 2026" },
    { event: "Added Salman back", correct: "14 August 2025" },
    { event: "You knew you felt the same", correct: "February 8, 2026, 3:00am" }
];

const matchOptions = [
    "Age 3", "June 2024", "January 27, 2026", 
    "14 August 2025", "February 8, 2026, 3:00am"
].sort(() => Math.random() - 0.5);

// =============================================
// PRIVATE SECTION
// =============================================
const privateQuestions = [
    {
        q: "Who first messaged after you added Salman back?",
        correct: "you",
        alternate: ["me", "manahil", "i did"]
    },
    {
        q: "What does Salman love about you but never says?",
        correct: "my nakhray",
        alternate: ["nakhre", "nakhray", "nakhras"]
    },
    {
        q: "What's OUR song?",
        correct: "Arz Kiya Hai",
        alternate: ["arz kiya", "arziya", "arz kiya hai"]
    },
    {
        q: "When did Salman first confess? (month/year)",
        correct: "July 2024",
        alternate: ["july 2024", "july"]
    }
];

// =============================================
// STATE
// =============================================
let currentQuestionIndex = 0;
let answers = new Array(quizData.length).fill(null);
let multiSelectAnswers = new Array(quizData.length).fill([]);
let matchAnswers = new Array(matchData.length).fill(null);
let privateAnswers = new Array(privateQuestions.length).fill(null);
let questionStatus = new Array(quizData.length).fill(null);
let matchStatus = new Array(matchData.length).fill(null);
let privateStatus = new Array(privateQuestions.length).fill(null);
let noButtonSelected = false;

let totalCorrect = 0;
const TOTAL_POSSIBLE = 20; // 10 main + 5 match + 4 private + 1 yes/no

// =============================================
// RENDER
// =============================================
function renderQuestion() {
    const container = document.getElementById('questionContainer');
    const q = quizData[currentQuestionIndex];
    
    let html = `
        <div class="question-card">
            <div class="question-number">question ${currentQuestionIndex + 1}/${quizData.length}</div>
            <div class="question-text">${q.question}</div>
    `;
    
    if (q.type === "mcq") {
        html += `<div class="options">`;
        q.options.forEach((opt, idx) => {
            const selected = answers[currentQuestionIndex] === idx ? 'selected' : '';
            html += `
                <div class="option ${selected}" onclick="selectOption(${idx})">
                    <span class="option-emoji">${opt.emoji}</span>
                    <span>${opt.text}</span>
                </div>
            `;
        });
        html += `</div>`;
    }
    
    else if (q.type === "multiselect-all") {
        html += `<div class="options">`;
        q.options.forEach((opt, idx) => {
            const selected = (multiSelectAnswers[currentQuestionIndex] || []).includes(idx) ? 'selected' : '';
            html += `
                <div class="option ${selected}" onclick="toggleMultiSelect(${idx})">
                    <span class="option-emoji">${opt.emoji}</span>
                    <span>${opt.text}</span>
                </div>
            `;
        });
        html += `</div>`;
        html += `<p style="color:#ffb6c1; text-align:center; font-size:14px;">✨ select all that apply</p>`;
    }
    
    else if (q.type === "qa") {
        html += `
            <input type="text" class="qa-input" 
                   placeholder="type your answer..." 
                   value="${answers[currentQuestionIndex] || ''}"
                   oninput="updateQAAnswer(this.value)">
        `;
    }
    
    if (questionStatus[currentQuestionIndex]) {
        html += `
            <div class="feedback ${questionStatus[currentQuestionIndex]}">
                ${questionStatus[currentQuestionIndex] === 'correct' ? '✓ yes!' : '✗ not quite'}
            </div>
        `;
    }
    
    html += `</div>`;
    
    if (currentQuestionIndex === quizData.length - 1) {
        html += renderMatchSection();
        html += renderPrivateSection();
    }
    
    container.innerHTML = html;
    document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
}

function renderMatchSection() {
    let html = `
        <div class="question-card">
            <div class="question-number">🎯 match the dates</div>
            <div class="match-container">
    `;
    
    matchData.forEach((item, idx) => {
        html += `
            <div class="match-row">
                <div class="match-event">${item.event}</div>
                <select class="match-select" onchange="updateMatchAnswer(${idx}, this.value)">
                    <option value="">— select —</option>
                    ${matchOptions.map(opt => 
                        `<option value="${opt}" ${matchAnswers[idx] === opt ? 'selected' : ''}>${opt}</option>`
                    ).join('')}
                </select>
            </div>
        `;
        if (matchStatus[idx]) {
            html += `
                <div class="feedback ${matchStatus[idx]}" style="margin:0 0 15px 0;">
                    ${matchStatus[idx] === 'correct' ? '✓ matched!' : '✗ try again'}
                </div>
            `;
        }
    });
    
    html += `</div></div>`;
    return html;
}

function renderPrivateSection() {
    let html = `
        <div class="private-section">
            <div class="private-title">💕 just for you 💕</div>
    `;
    
    privateQuestions.forEach((item, idx) => {
        html += `
            <div style="margin:25px 0;">
                <p style="color:#ffb6c1; margin-bottom:10px;">${item.q}</p>
                <input type="text" class="qa-input" 
                       placeholder="your answer..." 
                       value="${privateAnswers[idx] || ''}"
                       oninput="updatePrivateAnswer(${idx}, this.value)">
            </div>
        `;
        if (privateStatus[idx]) {
            html += `
                <div class="feedback ${privateStatus[idx]}" style="margin:-5px 0 15px 0;">
                    ${privateStatus[idx] === 'correct' ? '✓ yes!' : '✗ not quite'}
                </div>
            `;
        }
    });
    
    html += `
        <div style="margin:30px 0 20px; text-align:center;">
            <p style="color:#ffb6c1; margin-bottom:15px;">Stop asking deep questions?</p>
            <div class="yes-no-container">
                <button class="yes-btn" onclick="sadEmoji()">Yes</button>
                <button class="no-btn ${noButtonSelected ? 'selected' : ''}" onclick="noClicked()">No</button>
            </div>
            <div class="sad-emoji-container" id="sadEmojiContainer"></div>
        </div>
        
        <button class="nav-btn submit-btn" onclick="submitAll()">
            ✦ see your results ✦
        </button>
    `;
    
    html += `</div>`;
    return html;
}

// =============================================
// HANDLERS
// =============================================
function selectOption(idx) {
    answers[currentQuestionIndex] = idx;
    checkCurrentQuestion();
    renderQuestion();
}

function toggleMultiSelect(idx) {
    if (!multiSelectAnswers[currentQuestionIndex]) {
        multiSelectAnswers[currentQuestionIndex] = [];
    }
    
    const current = multiSelectAnswers[currentQuestionIndex];
    const pos = current.indexOf(idx);
    
    if (pos === -1) current.push(idx);
    else current.splice(pos, 1);
    
    current.sort();
    checkCurrentQuestion();
    renderQuestion();
}

function updateQAAnswer(value) {
    answers[currentQuestionIndex] = value;
    checkCurrentQuestion();
}

function updateMatchAnswer(idx, value) {
    matchAnswers[idx] = value;
    checkMatchQuestion(idx);
    renderQuestion();
}

function updatePrivateAnswer(idx, value) {
    privateAnswers[idx] = value;
    checkPrivateQuestion(idx);
}

function checkCurrentQuestion() {
    const q = quizData[currentQuestionIndex];
    let isCorrect = false;
    
    if (q.type === "mcq") {
        isCorrect = answers[currentQuestionIndex] === q.correct;
    }
    else if (q.type === "multiselect-all") {
        const selected = multiSelectAnswers[currentQuestionIndex] || [];
        isCorrect = JSON.stringify(selected) === JSON.stringify(q.correct);
    }
    else if (q.type === "qa") {
        const ans = (answers[currentQuestionIndex] || "").toLowerCase().trim();
        isCorrect = ans === q.correct.toLowerCase() || 
                   (q.alternate && q.alternate.some(a => ans === a.toLowerCase()));
    }
    
    const wasCorrect = questionStatus[currentQuestionIndex] === 'correct';
    
    if (isCorrect && !wasCorrect) {
        createParticleAnimation();
    }
    
    questionStatus[currentQuestionIndex] = isCorrect ? 'correct' : 'incorrect';
}

function checkMatchQuestion(idx) {
    const isCorrect = matchAnswers[idx] === matchData[idx].correct;
    const wasCorrect = matchStatus[idx] === 'correct';
    
    if (isCorrect && !wasCorrect) {
        createParticleAnimation();
    }
    
    matchStatus[idx] = isCorrect ? 'correct' : 'incorrect';
}

function checkPrivateQuestion(idx) {
    const q = privateQuestions[idx];
    const ans = (privateAnswers[idx] || "").toLowerCase().trim();
    const isCorrect = ans === q.correct.toLowerCase() || 
                     (q.alternate && q.alternate.some(a => ans === a.toLowerCase()));
    const wasCorrect = privateStatus[idx] === 'correct';
    
    if (isCorrect && !wasCorrect) {
        createParticleAnimation();
    }
    
    privateStatus[idx] = isCorrect ? 'correct' : 'incorrect';
}

function createParticleAnimation() {
    const container = document.getElementById('particle-container');
    const heart = document.getElementById('heartIcon').getBoundingClientRect();
    
    const cards = document.querySelectorAll('.question-card');
    if (!cards.length) return;
    
    const lastCard = cards[cards.length - 1].getBoundingClientRect();
    
    const heartX = heart.left + heart.width/2;
    const heartY = heart.top + heart.height/2;
    
    for (let i = 0; i < 12; i++) {
        setTimeout(() => {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.innerHTML = ['✨', '💫', '🌸', '🌹', '💗', '🌟'][Math.floor(Math.random() * 6)];
            
            const startX = lastCard.left + Math.random() * lastCard.width;
            const startY = lastCard.top + Math.random() * lastCard.height;
            
            particle.style.left = startX + 'px';
            particle.style.top = startY + 'px';
            
            const tx = heartX - startX;
            const ty = heartY - startY;
            
            particle.style.setProperty('--tx', tx + 'px');
            particle.style.setProperty('--ty', ty + 'px');
            
            container.appendChild(particle);
            
            setTimeout(() => particle.remove(), 1200);
        }, i * 40);
    }
    
    document.getElementById('heartIcon').classList.add('heart-pulse');
    setTimeout(() => {
        document.getElementById('heartIcon').classList.remove('heart-pulse');
    }, 600);
}

let sadCount = 0;
function sadEmoji() {
    sadCount++;
    document.getElementById('sadEmojiContainer').innerHTML += '<span class="sad-emoji">🥺</span>';
}

function noClicked() {
    noButtonSelected = true;
    document.getElementById('sadEmojiContainer').innerHTML = '';
    sadCount = 0;
    document.querySelector('.no-btn').classList.add('selected');
    document.querySelector('.yes-btn').classList.remove('selected');
    createParticleAnimation();
}

// =============================================
// NAVIGATION
// =============================================
function nextQuestion() {
    const q = quizData[currentQuestionIndex];
    if (q.type === "multiselect-all") {
        const selected = multiSelectAnswers[currentQuestionIndex] || [];
        if (selected.length !== q.options.length) {
            alert("You need to select ALL options!");
            return;
        }
    }
    
    if (currentQuestionIndex < quizData.length - 1) {
        currentQuestionIndex++;
        renderQuestion();
    }
}

function prevQuestion() {
    if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        renderQuestion();
    }
}

// =============================================
// SUBMIT
// =============================================
function submitAll() {
    totalCorrect = 0;
    
    quizData.forEach((q, idx) => {
        if (q.type === "mcq" && answers[idx] === q.correct) totalCorrect++;
        else if (q.type === "qa") {
            const ans = (answers[idx] || "").toLowerCase().trim();
            if (ans === q.correct.toLowerCase() || (q.alternate && q.alternate.some(a => ans === a.toLowerCase()))) {
                totalCorrect++;
            }
        }
        else if (q.type === "multiselect-all") {
            const selected = multiSelectAnswers[idx] || [];
            if (JSON.stringify(selected) === JSON.stringify(q.correct)) totalCorrect++;
        }
    });
    
    matchData.forEach((item, idx) => {
        if (matchAnswers[idx] === item.correct) totalCorrect++;
    });
    
    privateQuestions.forEach((item, idx) => {
        const ans = (privateAnswers[idx] || "").toLowerCase().trim();
        if (ans === item.correct.toLowerCase() || (item.alternate && item.alternate.some(a => ans === a.toLowerCase()))) {
            totalCorrect++;
        }
    });
    
    if (noButtonSelected) totalCorrect++;
    
    const percentage = Math.round((totalCorrect / TOTAL_POSSIBLE) * 100);
    document.getElementById('heartBadge').textContent = percentage + '%';
    document.getElementById('flowerCount').textContent = totalCorrect;
    document.getElementById('heartIcon').innerHTML = '❤️';
    document.getElementById('heartIcon').classList.add('heart-glow');
    
    showCertificate();
}

function showCertificate() {
    document.getElementById('questionContainer').innerHTML = '';
    document.getElementById('prevBtn').classList.add('hidden');
    document.getElementById('nextBtn').classList.add('hidden');
    
    const roses = Math.min(6, totalCorrect);
    const jasmine = Math.min(6, Math.max(0, totalCorrect - 6));
    const tulips = Math.min(6, Math.max(0, totalCorrect - 12));
    const extra = Math.max(0, totalCorrect - 18);
    
    function getFlowers(type, count) {
        let flowers = '';
        for (let i = 0; i < count; i++) {
            if (type === 'rose') flowers += '<span class="flower-rose" style="animation:bloom 0.5s; display:inline-block;">🌹</span>';
            if (type === 'jasmine') flowers += '<span class="flower-jasmine" style="animation:bloom 0.5s; display:inline-block;">🌼</span>';
            if (type === 'tulip') flowers += '<span class="flower-tulip" style="animation:bloom 0.5s; display:inline-block;">🌷</span>';
        }
        return flowers;
    }
    
    const certificate = `
        <div class="certificate">
            <h2>✦ certificate of love ✦</h2>
            <div class="certificate-seal">💮</div>
            <p style="font-size:22px;">awarded to:</p>
            <p style="font-size:52px; color:#ffb6c1; margin:15px 0;">Manahil</p>
            
            <div class="bouquet-display">
                <p style="color:#6fcf97; margin-bottom:20px;">your bouquet (${totalCorrect} flowers):</p>
                <div class="bouquet">
                    ${getFlowers('rose', roses)}
                    ${getFlowers('jasmine', jasmine)}
                    ${getFlowers('tulip', tulips)}
                    ${extra ? '🌸'.repeat(extra) : ''}
                </div>
            </div>
            
            <div style="margin:30px 0;">
                <p style="color:#6fcf97;">your heart:</p>
                <div style="font-size:80px; animation:pulse 2s infinite;">❤️</div>
                <p style="color:#ffb6c1; margin-top:10px;">${Math.round((totalCorrect/20)*100)}% full</p>
            </div>
            
            <!-- 👇 CHANGE THIS DATE BEFORE SENDING 👇 -->
            <div class="date-box">
                📅 <span>_______________</span>
            </div>
            <!-- 👆 CHANGE THIS DATE 👆 -->
            
            <div class="certificate-signature">
                yours always,<br>Salman
            </div>
            
            <p style="color:#6fcf97; margin-top:20px;">${totalCorrect}/20 · you know us perfectly</p>
        </div>
    `;
    
    document.getElementById('certificateContainer').innerHTML = certificate;
    document.getElementById('certificateContainer').classList.remove('hidden');
}

// Start
renderQuestion();
</script>
</body>
</html>
