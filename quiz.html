<!DOCTYPE html>
<html>
<head>
<title>✦ How Well Do You Know Us? ✦ </title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* {
margin:0;
padding:0;
box-sizing:border-box;
}

body {
background:linear-gradient(145deg, #1a0f24 0%, #2d1a2d 50%, #1a2f2a 100%);
font-family:'Georgia', 'Times New Roman', serif;
min-height:100vh;
padding:20px;
color:#f5e6ff;
position:relative;
overflow-x:hidden;
}

/* Floating particles container */
#particle-container {
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:1000;
}

.particle {
position:absolute;
font-size:20px;
animation:floatToHeart 1s forwards;
z-index:1000;
}

@keyframes floatToHeart {
0% {
    transform:translate(0, 0) scale(1);
    opacity:1;
}
100% {
    transform:translate(var(--tx), var(--ty)) scale(0);
    opacity:0;
}
}

/* Heart animation */
.heart-pulse {
animation:heartBeat 0.5s;
}

@keyframes heartBeat {
0% { transform:scale(1); }
30% { transform:scale(1.3); filter:drop-shadow(0 0 30px #ff69b4); }
100% { transform:scale(1); }
}

/* Emerald green accent */
.emerald {
color:#50c878;
text-shadow:0 0 10px rgba(80,200,120,0.3);
}

/* Main container */
.quiz-container {
max-width:800px;
margin:0 auto;
position:relative;
z-index:10;
}

/* Header */
.header {
text-align:center;
padding:40px 20px;
background:rgba(20,10,20,0.4);
backdrop-filter:blur(10px);
border-radius:60px 60px 30px 30px;
margin-bottom:30px;
border:1px solid rgba(255,182,193,0.2);
}

h1 {
font-size:48px;
font-weight:300;
background:linear-gradient(135deg, #ffd7e0, #ffb6c1, #50c878);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:15px;
font-family:'Playfair Display', 'Georgia', serif;
}

.subtitle {
color:#d8bfd8;
font-size:16px;
letter-spacing:4px;
margin-bottom:20px;
}

/* Progress section - Heart on side */
.progress-section {
display:flex;
align-items:center;
justify-content:flex-end;
gap:20px;
margin:30px 0;
position:relative;
}

.heart-container {
display:flex;
flex-direction:column;
align-items:center;
position:relative;
}

.heart-icon {
font-size:80px;
cursor:pointer;
transition:0.3s;
filter:drop-shadow(0 0 15px rgba(255,105,180,0.5));
position:relative;
z-index:5;
}

.heart-fill-badge {
position:absolute;
bottom:-10px;
right:-10px;
background:#50c878;
color:#1a0f1c;
border-radius:50%;
width:30px;
height:30px;
display:flex;
align-items:center;
justify-content:center;
font-size:14px;
font-weight:bold;
border:2px solid #ffb6c1;
}

.flower-counter {
background:rgba(255,182,193,0.2);
backdrop-filter:blur(10px);
padding:12px 25px;
border-radius:50px;
border:1px solid #50c878;
display:flex;
align-items:center;
gap:10px;
}

.flower-counter span {
font-size:24px;
}

.flower-count {
color:#50c878;
font-size:18px;
font-weight:bold;
margin-left:5px;
}

/* Question card */
.question-card {
background:rgba(25,15,22,0.7);
backdrop-filter:blur(15px);
border-radius:40px;
padding:40px;
margin:30px 0;
border:2px solid rgba(255,182,193,0.2);
box-shadow:0 20px 40px rgba(0,0,0,0.4);
}

.question-number {
color:#50c878;
font-size:14px;
letter-spacing:3px;
margin-bottom:15px;
}

.question-text {
font-size:24px;
color:#fff0f5;
margin-bottom:30px;
line-height:1.5;
font-weight:300;
}

/* Options */
.options {
display:flex;
flex-direction:column;
gap:15px;
margin:30px 0;
}

.option {
background:rgba(255,182,193,0.05);
border:1px solid rgba(255,182,193,0.3);
border-radius:50px;
padding:18px 25px;
color:#f0e6ff;
font-size:18px;
cursor:pointer;
transition:all 0.3s;
display:flex;
align-items:center;
gap:15px;
}

.option:hover {
background:rgba(255,182,193,0.15);
transform:translateX(5px);
border-color:#50c878;
}

.option.selected {
background:rgba(80,200,120,0.15);
border-color:#50c878;
box-shadow:0 0 20px rgba(80,200,120,0.3);
}

.option-emoji {
font-size:24px;
width:40px;
}

/* Question answer input */
.qa-input {
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,182,193,0.3);
border-radius:50px;
padding:18px 25px;
width:100%;
color:white;
font-size:18px;
margin:20px 0;
}

.qa-input:focus {
outline:none;
border-color:#50c878;
}

/* Result feedback */
.feedback {
margin:20px 0;
padding:15px;
border-radius:30px;
text-align:center;
font-size:18px;
animation:slideIn 0.3s;
}

.feedback.correct {
background:rgba(80,200,120,0.2);
border:1px solid #50c878;
color:#50c878;
}

.feedback.incorrect {
background:rgba(255,100,100,0.2);
border:1px solid #ff6464;
color:#ff6464;
}

@keyframes slideIn {
0% { opacity:0; transform:translateY(-10px); }
100% { opacity:1; transform:translateY(0); }
}

/* Match the date section */
.match-container {
display:flex;
flex-direction:column;
gap:20px;
margin:30px 0;
}

.match-row {
display:flex;
align-items:center;
gap:15px;
flex-wrap:wrap;
}

.match-event {
flex:2;
min-width:200px;
background:rgba(255,182,193,0.05);
padding:15px 20px;
border-radius:30px;
border:1px solid rgba(255,182,193,0.2);
}

.match-select {
flex:1;
min-width:150px;
padding:15px 20px;
border-radius:30px;
background:rgba(20,10,15,0.8);
border:1px solid rgba(255,182,193,0.3);
color:white;
font-size:16px;
cursor:pointer;
}

.match-select option {
background:#1a0f1c;
}

/* Private section (not secret, just personal) */
.private-section {
background:rgba(80,200,120,0.1);
border:2px dashed #50c878;
border-radius:40px;
padding:30px;
margin:40px 0;
}

.private-section h3 {
color:#ffb6c1;
font-size:22px;
margin-bottom:20px;
}

/* Yes/No special buttons */
.yes-no-container {
display:flex;
gap:20px;
justify-content:center;
margin:30px 0;
}

.yes-btn, .no-btn {
padding:15px 40px;
border-radius:50px;
font-size:20px;
cursor:pointer;
transition:0.3s;
border:none;
font-family:'Georgia', serif;
}

.yes-btn {
background:rgba(255,100,100,0.2);
border:1px solid #ff6464;
color:#ff6464;
}

.yes-btn:hover {
background:rgba(255,100,100,0.3);
transform:scale(1.05);
}

.no-btn {
background:rgba(80,200,120,0.2);
border:1px solid #50c878;
color:#50c878;
cursor:pointer;
}

.no-btn:hover {
background:rgba(80,200,120,0.3);
transform:scale(1.05);
}

.no-btn.selected {
background:#50c878;
color:#1a0f1c;
box-shadow:0 0 20px #50c878;
}

/* Sad emoji container */
.sad-emoji-container {
display:flex;
flex-wrap:wrap;
gap:5px;
justify-content:center;
margin:20px 0;
min-height:40px;
}

.sad-emoji {
font-size:24px;
animation:pop 0.3s;
}

@keyframes pop {
0% { transform:scale(0); }
80% { transform:scale(1.2); }
100% { transform:scale(1); }
}

/* Bouquet display */
.bouquet-display {
text-align:center;
padding:40px;
background:rgba(0,0,0,0.3);
border-radius:60px;
margin:30px 0;
}

.bouquet {
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:15px;
font-size:50px;
animation:float 3s infinite;
}

@keyframes float {
0% { transform:translateY(0); }
50% { transform:translateY(-10px); }
100% { transform:translateY(0); }
}

/* Certificate */
.certificate {
background:linear-gradient(145deg, #2a1a2a, #1f2a1f);
border:3px double #50c878;
border-radius:40px;
padding:50px;
text-align:center;
margin:40px 0;
box-shadow:0 0 50px rgba(80,200,120,0.3);
}

.certificate h2 {
font-size:48px;
color:#ffb6c1;
margin-bottom:20px;
}

.certificate-seal {
font-size:70px;
margin:30px;
filter:drop-shadow(0 0 20px gold);
}

.certificate-signature {
font-size:24px;
color:#50c878;
font-style:italic;
margin:30px 0;
}

.date-placeholder {
color:#a88aa8;
font-size:16px;
background:rgba(255,255,255,0.05);
padding:10px;
border-radius:30px;
display:inline-block;
margin:20px 0;
}

/* Navigation */
.quiz-nav {
display:flex;
justify-content:space-between;
margin-top:30px;
}

.nav-btn {
background:transparent;
border:1px solid #ffb6c1;
color:#ffb6c1;
padding:12px 30px;
border-radius:50px;
cursor:pointer;
transition:0.3s;
font-size:16px;
}

.nav-btn:hover:not(:disabled) {
background:#ffb6c1;
color:#1a0f1c;
}

.nav-btn:disabled {
opacity:0.3;
cursor:not-allowed;
}

/* Mobile */
@media (max-width:600px) {
h1 { font-size:32px; }
.question-card { padding:25px; }
.question-text { font-size:20px; }
.option { padding:15px; }
.heart-icon { font-size:60px; }
}

/* Hidden class */
.hidden {
display:none !important;
}

/* Flower colors */
.flower-rose { color:#ff4d6d; }
.flower-jasmine { color:#fff0d0; }
.flower-tulip { color:#ff8c69; }
</style>
</head>
<body>

<!-- Particle container for heart animation -->
<div id="particle-container"></div>

<div class="quiz-container">
    
    <!-- Header -->
    <div class="header">
        <h1>✦ how well do you know us? ✦</h1>
        <div class="subtitle">a quiz for Manahil · from Salman</div>
    </div>
    
    <!-- Progress Section: Heart on side + Flower counter -->
    <div class="progress-section">
        <div class="flower-counter">
            <span>🌸</span>
            <span class="flower-count" id="flowerCount">0</span>
            <span style="color:#ffb6c1;">/ 20</span>
        </div>
        <div class="heart-container" id="heartContainer">
            <div class="heart-icon" id="heartIcon">🤍</div>
            <div class="heart-fill-badge" id="heartBadge">0%</div>
        </div>
    </div>
    
    <!-- Question Container -->
    <div id="questionContainer"></div>
    
    <!-- Navigation -->
    <div class="quiz-nav">
        <button class="nav-btn" id="prevBtn" onclick="prevQuestion()" disabled>← previous</button>
        <button class="nav-btn" id="nextBtn" onclick="nextQuestion()">next →</button>
    </div>
    
    <!-- Final Certificate (hidden until end) -->
    <div id="certificateContainer" class="hidden"></div>
    
</div>

<script>
// =============================================
// QUIZ DATA - For Manahil
// =============================================

const quizData = [
    // Q1: Salman's birthday
    {
        type: "mcq",
        question: "When was Salman born?",
        options: [
            { text: "April 25, 2005", emoji: "🌹" },
            { text: "September 12, 2004", emoji: "🌸" },
            { text: "November 3, 2006", emoji: "🌺" },
            { text: "February 18, 2005", emoji: "🌷" }
        ],
        correct: 0
    },
    
    // Q2: Your birthday
    {
        type: "mcq",
        question: "When were you born?",
        options: [
            { text: "May 10, 2005", emoji: "🌸" },
            { text: "July 22, 2006", emoji: "🌹" },
            { text: "March 15, 2004", emoji: "🌺" },
            { text: "December 5, 2005", emoji: "🌷" }
        ],
        correct: 0
    },
    
    // Q3: When you added him back
    {
        type: "qa",
        question: "What date did you add Salman back on Snapchat? (DD Month YYYY)",
        correct: "14 August 2025",
        alternate: ["14th August 2025", "august 14 2025", "14 august 2025"]
    },
    
    // Q4: When you knew you felt the same
    {
        type: "qa",
        question: "When did you know you felt the same way for him? (include date and time)",
        correct: "February 8, 2026, 3:00am",
        alternate: ["february 8 2026 3am", "8 feb 2026 3:00", "feb 8 2026 3am", "february 8 2026 3:00am"]
    },
    
    // Q5: Nicknames (MUST SELECT ALL)
    {
        type: "multiselect-all",
        question: "What are ALL the nicknames Salman calls you?",
        options: [
            { text: "Rapunzel", emoji: "👸" },
            { text: "jaan", emoji: "💗" },
            { text: "love", emoji: "💕" },
            { text: "my lady", emoji: "👑" },
            { text: "my queen", emoji: "👸" }
        ],
        correct: [0, 1, 2, 3, 4]
    },
    
    // Q6: Character comparison
    {
        type: "mcq",
        question: "What character did you compare Salman to?",
        options: [
            { text: "Flynn Rider", emoji: "🦸" },
            { text: "Aladdin", emoji: "🧞" },
            { text: "Prince Charming", emoji: "🤴" },
            { text: "Hercules", emoji: "🏺" }
        ],
        correct: 0
    },
    
    // Q7: Your best features (MUST SELECT ALL)
    {
        type: "multiselect-all",
        question: "What are your best features? (select all that apply)",
        options: [
            { text: "Your eyes", emoji: "👀" },
            { text: "Your hair", emoji: "💇‍♀️" },
            { text: "Your smile", emoji: "😊" },
            { text: "Your laugh", emoji: "😂" },
            { text: "Your talks", emoji: "💬" },
            { text: "Your attitude", emoji: "🔥" }
        ],
        correct: [0, 1, 2, 3, 4, 5]
    },
    
    // Q8: When you exchanged numbers
    {
        type: "mcq",
        question: "When did you and Salman exchange phone numbers?",
        options: [
            { text: "June 2024", emoji: "☀️" },
            { text: "October 2023", emoji: "🍂" },
            { text: "March 2025", emoji: "🌸" },
            { text: "January 2024", emoji: "❄️" }
        ],
        correct: 0
    },
    
    // Q9: Where Salman moved
    {
        type: "qa",
        question: "Where did Salman move to in 2024?",
        correct: "USA then Canada",
        alternate: ["usa then canada", "america then canada", "united states then canada", "us then canada"]
    },
    
    // Q10: Distance
    {
        type: "mcq",
        question: "How many kilometers apart are you?",
        options: [
            { text: "12,000km", emoji: "🌎" },
            { text: "9,500km", emoji: "🌍" },
            { text: "14,200km", emoji: "🌏" },
            { text: "7,800km", emoji: "🌍" }
        ],
        correct: 0
    }
];

// =============================================
// MATCH THE DATE SECTION
// =============================================
const matchData = [
    { event: "You first met", correct: "Age 3" },
    { event: "You exchanged numbers", correct: "June 2024" },
    { event: "Flynn Rider moment", correct: "January 27, 2026" },
    { event: "You added Salman back on Snapchat", correct: "14 August 2025" },
    { event: "You knew you felt the same", correct: "February 8, 2026, 3:00am" }
];

// Shuffle the options
const matchOptions = [
    "Age 3", "June 2024", "January 27, 2026", 
    "14 August 2025", "February 8, 2026, 3:00am"
].sort(() => Math.random() - 0.5);

// =============================================
// PRIVATE SECTION
// =============================================
const privateQuestions = [
    {
        q: "Who was the first person to message after you added Salman back on Snapchat?",
        correct: "you",
        type: "qa",
        alternate: ["me", "manahil", "i did"]
    },
    {
        q: "What is something Salman loves about you but never says? (write what you think)",
        correct: "nakhray",
        type: "qa",
        alternate: ["nakhre", "my nakhray", "nakhras", "your nakhray"]
    },
    {
        q: "What's OUR song?",
        correct: "Arz Kiya Hai",
        type: "qa",
        alternate: ["arz kiya", "arziya", "arz kiya hai"]
    },
    {
        q: "When did Salman first confess to you? (month and year)",
        correct: "July 2024",
        type: "qa",
        alternate: ["july 2024", "july"]
    }
];

// =============================================
// GAME STATE
// =============================================
let currentQuestionIndex = 0;
let answers = new Array(quizData.length).fill(null);
let multiSelectAnswers = new Array(quizData.length).fill([]);
let matchAnswers = new Array(matchData.length).fill(null);
let privateAnswers = new Array(privateQuestions.length).fill(null);
let questionStatus = new Array(quizData.length).fill(null);
let matchStatus = new Array(matchData.length).fill(null);
let privateStatus = new Array(privateQuestions.length).fill(null);
let sadEmojis = 0;
let correctCount = 0;
let flowersEarned = 0;
let noButtonSelected = false;

// =============================================
// RENDER FUNCTIONS
// =============================================
function renderQuestion() {
    const container = document.getElementById('questionContainer');
    const q = quizData[currentQuestionIndex];
    
    let html = `
        <div class="question-card">
            <div class="question-number">question ${currentQuestionIndex + 1} / ${quizData.length}</div>
            <div class="question-text">${q.question}</div>
    `;
    
    if (q.type === "mcq") {
        html += `<div class="options" id="optionsContainer">`;
        q.options.forEach((opt, idx) => {
            const selected = answers[currentQuestionIndex] === idx ? 'selected' : '';
            html += `
                <div class="option ${selected}" onclick="selectOption(${idx})">
                    <span class="option-emoji">${opt.emoji}</span>
                    <span>${opt.text}</span>
                </div>
            `;
        });
        html += `</div>`;
    }
    
    else if (q.type === "multiselect-all") {
        html += `<div class="options" id="optionsContainer">`;
        q.options.forEach((opt, idx) => {
            const selected = (multiSelectAnswers[currentQuestionIndex] || []).includes(idx) ? 'selected' : '';
            html += `
                <div class="option ${selected}" onclick="toggleMultiSelect(${idx})">
                    <span class="option-emoji">${opt.emoji}</span>
                    <span>${opt.text}</span>
                </div>
            `;
        });
        html += `</div>`;
        html += `<p style="color:#ffb6c1; margin-top:10px;"><small>✨ select all that apply</small></p>`;
    }
    
    else if (q.type === "qa") {
        const currentAnswer = answers[currentQuestionIndex] || '';
        html += `
            <input type="text" class="qa-input" id="qaInput" 
                   placeholder="type your answer..." value="${currentAnswer}"
                   oninput="updateQAAnswer(this.value)">
        `;
    }
    
    if (questionStatus[currentQuestionIndex]) {
        const status = questionStatus[currentQuestionIndex];
        html += `
            <div class="feedback ${status}">
                ${status === 'correct' ? '✓ correct!' : '✗ not quite...'}
            </div>
        `;
    }
    
    html += `</div>`;
    
    if (currentQuestionIndex === quizData.length - 1) {
        html += renderMatchSection();
        html += renderPrivateSection();
    }
    
    container.innerHTML = html;
    document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
}

function renderMatchSection() {
    let html = `
        <div class="question-card">
            <div class="question-number">bonus round · match the dates</div>
            <div class="question-text">match each memory to its date</div>
            <div class="match-container">
    `;
    
    matchData.forEach((item, idx) => {
        html += `
            <div class="match-row">
                <div class="match-event">${item.event}</div>
                <select class="match-select" onchange="updateMatchAnswer(${idx}, this.value)">
                    <option value="">select date</option>
                    ${matchOptions.map(opt => 
                        `<option value="${opt}" ${matchAnswers[idx] === opt ? 'selected' : ''}>${opt}</option>`
                    ).join('')}
                </select>
            </div>
        `;
        
        if (matchStatus[idx]) {
            html += `
                <div class="feedback ${matchStatus[idx]}" style="margin-top:5px; margin-bottom:10px;">
                    ${matchStatus[idx] === 'correct' ? '✓ correct!' : '✗ not quite...'}
                </div>
            `;
        }
    });
    
    html += `</div></div>`;
    return html;
}

function renderPrivateSection() {
    let html = `
        <div class="question-card private-section">
            <div class="question-number">✨ just between us ✨</div>
            <div class="question-text">only you would know these</div>
    `;
    
    privateQuestions.forEach((item, idx) => {
        html += `
            <div style="margin:30px 0;">
                <p style="color:#ffb6c1; margin-bottom:15px;">${item.q}</p>
                <input type="text" class="qa-input" 
                       placeholder="your answer..." 
                       value="${privateAnswers[idx] || ''}"
                       oninput="updatePrivateAnswer(${idx}, this.value)">
            </div>
        `;
        
        if (privateStatus[idx]) {
            html += `
                <div class="feedback ${privateStatus[idx]}" style="margin-top:5px; margin-bottom:10px;">
                    ${privateStatus[idx] === 'correct' ? '✓ correct!' : '✗ not quite...'}
                </div>
            `;
        }
    });
    
    html += `
        <div style="margin:40px 0; text-align:center;">
            <p style="color:#ffb6c1; font-size:20px; margin-bottom:20px;">Do you want Salman to stop asking you deep questions?</p>
            <div class="yes-no-container">
                <button class="yes-btn" onclick="sadEmoji()">Yes</button>
                <button class="no-btn ${noButtonSelected ? 'selected' : ''}" onclick="noClicked()">No</button>
            </div>
            <div class="sad-emoji-container" id="sadEmojiContainer"></div>
        </div>
        
        <button class="nav-btn" onclick="submitAll()" style="margin:30px auto; display:block; background:#50c878; color:#1a0f1c; border:none; padding:15px 40px; font-size:18px;">
            ✦ finish & see your results ✦
        </button>
    `;
    
    html += `</div>`;
    return html;
}

// =============================================
// HANDLER FUNCTIONS
// =============================================
function selectOption(idx) {
    answers[currentQuestionIndex] = idx;
    checkCurrentQuestion();
    renderQuestion();
}

function toggleMultiSelect(idx) {
    if (!multiSelectAnswers[currentQuestionIndex]) {
        multiSelectAnswers[currentQuestionIndex] = [];
    }
    
    const current = multiSelectAnswers[currentQuestionIndex];
    const pos = current.indexOf(idx);
    
    if (pos === -1) {
        current.push(idx);
    } else {
        current.splice(pos, 1);
    }
    
    current.sort((a,b) => a-b);
    checkCurrentQuestion();
    renderQuestion();
}

function updateQAAnswer(value) {
    answers[currentQuestionIndex] = value;
    checkCurrentQuestion();
}

function updateMatchAnswer(idx, value) {
    matchAnswers[idx] = value;
    checkMatchQuestion(idx);
    renderQuestion();
}

function updatePrivateAnswer(idx, value) {
    privateAnswers[idx] = value;
    checkPrivateQuestion(idx);
}

function checkCurrentQuestion() {
    const q = quizData[currentQuestionIndex];
    let isCorrect = false;
    
    if (q.type === "mcq") {
        isCorrect = answers[currentQuestionIndex] === q.correct;
    }
    else if (q.type === "multiselect-all") {
        const selected = multiSelectAnswers[currentQuestionIndex] || [];
        isCorrect = JSON.stringify(selected.sort()) === JSON.stringify(q.correct.sort());
    }
    else if (q.type === "qa") {
        const ans = (answers[currentQuestionIndex] || "").toLowerCase().trim();
        isCorrect = ans === q.correct.toLowerCase() || 
                   (q.alternate && q.alternate.some(a => ans === a.toLowerCase()));
    }
    
    const wasCorrect = questionStatus[currentQuestionIndex] === 'correct';
    
    if (isCorrect && !wasCorrect) {
        createParticleAnimation();
    }
    
    questionStatus[currentQuestionIndex] = isCorrect ? 'correct' : 'incorrect';
}

function checkMatchQuestion(idx) {
    const isCorrect = matchAnswers[idx] === matchData[idx].correct;
    const wasCorrect = matchStatus[idx] === 'correct';
    
    if (isCorrect && !wasCorrect) {
        createParticleAnimation();
    }
    
    matchStatus[idx] = isCorrect ? 'correct' : 'incorrect';
}

function checkPrivateQuestion(idx) {
    const q = privateQuestions[idx];
    const ans = (privateAnswers[idx] || "").toLowerCase().trim();
    const isCorrect = ans === q.correct.toLowerCase() || 
                     (q.alternate && q.alternate.some(a => ans === a.toLowerCase()));
    const wasCorrect = privateStatus[idx] === 'correct';
    
    if (isCorrect && !wasCorrect) {
        createParticleAnimation();
    }
    
    privateStatus[idx] = isCorrect ? 'correct' : 'incorrect';
}

function createParticleAnimation() {
    const container = document.getElementById('particle-container');
    const heart = document.getElementById('heartIcon').getBoundingClientRect();
    
    const questionCard = document.querySelector('.question-card');
    if (!questionCard) return;
    
    const cardBounds = questionCard.getBoundingClientRect();
    
    const heartX = heart.left + heart.width/2;
    const heartY = heart.top + heart.height/2;
    
    for (let i = 0; i < 15; i++) {
        setTimeout(() => {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.innerHTML = ['✨', '💫', '🌸', '🌹', '💗', '🌟', '💕'][Math.floor(Math.random() * 7)];
            
            const startX = cardBounds.left + Math.random() * cardBounds.width;
            const startY = cardBounds.top + Math.random() * cardBounds.height;
            
            particle.style.left = startX + 'px';
            particle.style.top = startY + 'px';
            
            const tx = heartX - startX;
            const ty = heartY - startY;
            
            particle.style.setProperty('--tx', tx + 'px');
            particle.style.setProperty('--ty', ty + 'px');
            
            container.appendChild(particle);
            
            setTimeout(() => {
                particle.remove();
            }, 1000);
        }, i * 30);
    }
    
    document.getElementById('heartIcon').classList.add('heart-pulse');
    setTimeout(() => {
        document.getElementById('heartIcon').classList.remove('heart-pulse');
    }, 500);
}

let sadCount = 0;
function sadEmoji() {
    sadCount++;
    const container = document.getElementById('sadEmojiContainer');
    const sad = document.createElement('span');
    sad.className = 'sad-emoji';
    sad.textContent = '🥺';
    container.appendChild(sad);
}

function noClicked() {
    noButtonSelected = true;
    document.getElementById('sadEmojiContainer').innerHTML = '';
    sadCount = 0;
    document.querySelector('.no-btn').classList.add('selected');
    document.querySelector('.yes-btn').classList.remove('selected');
    createParticleAnimation();
}

// =============================================
// NAVIGATION
// =============================================
function nextQuestion() {
    const q = quizData[currentQuestionIndex];
    if (q.type === "multiselect-all") {
        const selected = multiSelectAnswers[currentQuestionIndex] || [];
        if (selected.length !== q.options.length) {
            alert("You need to select ALL options for this question!");
            return;
        }
    }
    
    if (currentQuestionIndex < quizData.length - 1) {
        currentQuestionIndex++;
        renderQuestion();
    }
}

function prevQuestion() {
    if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        renderQuestion();
    }
}

// =============================================
// SUBMIT & CALCULATE RESULTS
// =============================================
function submitAll() {
    correctCount = 0;
    let totalPossible = 0;
    
    quizData.forEach((q, idx) => {
        totalPossible++;
        if (q.type === "mcq" && answers[idx] === q.correct) correctCount++;
        else if (q.type === "qa") {
            const ans = (answers[idx] || "").toLowerCase().trim();
            if (ans === q.correct.toLowerCase() || (q.alternate && q.alternate.some(a => ans === a.toLowerCase()))) {
                correctCount++;
            }
        }
        else if (q.type === "multiselect-all") {
            const selected = multiSelectAnswers[idx] || [];
            if (JSON.stringify(selected.sort()) === JSON.stringify(q.correct.sort())) {
                correctCount++;
            }
        }
    });
    
    matchData.forEach((item, idx) => {
        totalPossible++;
        if (matchAnswers[idx] === item.correct) correctCount++;
    });
    
    privateQuestions.forEach((item, idx) => {
        totalPossible++;
        const ans = (privateAnswers[idx] || "").toLowerCase().trim();
        if (ans === item.correct.toLowerCase() || (item.alternate && item.alternate.some(a => ans === a.toLowerCase()))) {
            correctCount++;
        }
    });
    
    totalPossible++;
    if (noButtonSelected) correctCount++;
    
    flowersEarned = correctCount;
    
    const percentage = Math.round((correctCount / totalPossible) * 100);
    document.getElementById('heartBadge').textContent = percentage + '%';
    document.getElementById('flowerCount').textContent = flowersEarned;
    
    if (percentage > 0) {
        document.getElementById('heartIcon').innerHTML = '❤️';
    }
    
    showCertificate();
}

// =============================================
// SHOW CERTIFICATE
// =============================================
function showCertificate() {
    document.getElementById('questionContainer').innerHTML = '';
    document.getElementById('prevBtn').classList.add('hidden');
    document.getElementById('nextBtn').classList.add('hidden');
    
    const totalFlowers = flowersEarned;
    const roses = Math.min(5, totalFlowers);
    const jasmine = Math.min(5, Math.max(0, totalFlowers - 5));
    const tulips = Math.min(5, Math.max(0, totalFlowers - 10));
    const extra = Math.max(0, totalFlowers - 15);
    
    function getFlowerEmoji(type, count) {
        let emojis = '';
        for (let i = 0; i < count; i++) {
            if (type === 'rose') emojis += '<span class="flower-rose" style="font-size:45px; display:inline-block; animation:bloom 0.5s;">🌹</span>';
            if (type === 'jasmine') emojis += '<span class="flower-jasmine" style="font-size:45px; display:inline-block; animation:bloom 0.5s;">🌼</span>';
            if (type === 'tulip') emojis += '<span class="flower-tulip" style="font-size:45px; display:inline-block; animation:bloom 0.5s;">🌷</span>';
        }
        return emojis;
    }
    
    const certificate = `
        <div class="certificate">
            <h2>✦ CERTIFICATE OF LOVE ✦</h2>
            <div class="certificate-seal">💮</div>
            <p style="font-size:24px; margin:20px 0;">awarded to:</p>
            <p style="font-size:48px; color:#ffb6c1; margin:20px 0; font-family:'Playfair Display';">Manahil</p>
            <p style="font-size:20px; margin:30px 0;">for knowing our story by heart</p>
            
            <div class="bouquet-display">
                <p style="color:#50c878; margin-bottom:20px; font-size:18px;">your bouquet (${flowersEarned} flowers):</p>
                <div class="bouquet">
                    ${getFlowerEmoji('rose', roses)}
                    ${getFlowerEmoji('jasmine', jasmine)}
                    ${getFlowerEmoji('tulip', tulips)}
                    ${extra > 0 ? '🌸'.repeat(extra) : ''}
                </div>
            </div>
            
            <div style="margin:30px 0;">
                <p style="color:#50c878; margin-bottom:15px;">your heart:</p>
                <div style="font-size:80px; animation:pulse 2s infinite;">❤️</div>
                <p style="color:#ffb6c1; margin-top:15px;">${Math.round((flowersEarned/20)*100)}% full</p>
            </div>
            
            <!-- 👇 CHANGE THIS DATE BEFORE SENDING 👇 -->
            <div class="date-placeholder">
                📅 <span style="color:#ffb6c1;">March 18, 2026</span>
            </div>
            <!-- 👆 CHANGE THIS DATE 👆 -->
            
            <div class="certificate-signature">
                yours always,<br>
                <span style="font-size:28px;">Salman</span>
            </div>
            
            <p style="margin-top:40px; font-size:16px; color:#50c878;">${flowersEarned}/20 correct · you know us beautifully</p>
        </div>
    `;
    
    document.getElementById('certificateContainer').innerHTML = certificate;
    document.getElementById('certificateContainer').classList.remove('hidden');
}

// Initialize
renderQuestion();

const style = document.createElement('style');
style.textContent = `
    @keyframes pulse {
        0% { transform:scale(1); }
        50% { transform:scale(1.1); filter:drop-shadow(0 0 20px #ff69b4); }
        100% { transform:scale(1); }
    }
    @keyframes bloom {
        0% { transform:scale(0) rotate(0deg); opacity:0; }
        100% { transform:scale(1) rotate(360deg); opacity:1; }
    }
`;
document.head.appendChild(style);
</script>
