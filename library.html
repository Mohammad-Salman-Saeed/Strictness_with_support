<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title> Things I never said </title>

<style>

body{
margin:0;
font-family:Georgia,serif;
background:url("https://images.unsplash.com/photo-1521587760476-6c12a4b040da") center/cover fixed;
}

/* library area */

.library{
width:100%;
padding-top:60px;
}

/* shelves */

.shelf{
display:flex;
justify-content:center;
gap:6px;
margin:60px 0;
height:150px;
}

/* normal books */

.book{
width:40px;
height:160px;
border-radius:4px;
box-shadow:2px 2px 6px rgba(0,0,0,0.5);
}

/* color variations */

.red{background:linear-gradient(#7b2d2d,#3d1111);}
.green{background:linear-gradient(#355e3b,#1d3521);}
.blue{background:linear-gradient(#4b5d8a,#2d3c63);}
.brown{background:linear-gradient(#6b4423,#3d2612);}

/* special books */

.special{
width:45px;
background:linear-gradient(#9b5c2e,#4a2913);
color:white;
display:flex;
align-items:center;
justify-content:center;
writing-mode:vertical-rl;
text-orientation:mixed;
font-size:14px;
cursor:pointer;
transition:0.3s;
}

.special:hover{
transform:scale(1.05);
box-shadow:0 0 15px rgba(255,220,150,0.7);
}

/* book reader */

.reader{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:600px;
height:400px;
background:#fdf6e3;
box-shadow:0 0 25px rgba(0,0,0,0.7);
display:none;
flex-direction:column;
padding:30px;
border-radius:6px;
}

.page{
flex:1;
overflow:auto;
font-size:18px;
line-height:1.6;
}

.controls{
display:flex;
justify-content:space-between;
margin-top:15px;
}

button{
padding:8px 14px;
font-size:14px;
cursor:pointer;
border:none;
background:#6b4423;
color:white;
border-radius:4px;
}

button:hover{
background:#8a5a33;
}

.close{
position:absolute;
top:8px;
right:12px;
font-size:22px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="library">

<!-- Shelf 1 -->

<div class="shelf">

<div class="book red"></div>
<div class="book blue"></div>

<div class="book special" onclick="openBook(0)">Noticing</div>

<div class="book green"></div>
<div class="book brown"></div>
<div class="book blue"></div>

<div class="book special" onclick="openBook(1)">Small</div>

<div class="book red"></div>
<div class="book blue"></div>
<div class="book green"></div>
<div class="book brown"></div>

</div>

<!-- Shelf 2 -->

<div class="shelf">

<div class="book blue"></div>
<div class="book red"></div>

<div class="book special" onclick="openBook(2)">Unsai​d</div>

<div class="book green"></div>
<div class="book brown"></div>

<div class="book special" onclick="openBook(3)">Words</div>

<div class="book blue"></div>
<div class="book red"></div>
<div class="book green"></div>
<div class="book brown"></div>

</div>

<!-- Shelf 3 -->

<div class="shelf">

<div class="book green"></div>
<div class="book red"></div>

<div class="book special" onclick="openBook(4)">Future</div>

<div class="book blue"></div>
<div class="book brown"></div>
<div class="book red"></div>
<div class="book green"></div>
<div class="book blue"></div>

</div>

</div>

<!-- BOOK READER -->

<div class="reader" id="reader">

<div class="close" onclick="closeBook()">✕</div>

<div class="page" id="page"></div>

<div class="controls">
<button onclick="prevPage()">Previous</button>
<button onclick="nextPage()">Next</button>
</div>

</div>

<script>

let letters=[
`Sometimes I notice small things about you.
The way you pause before answering.
The way your eyes move when you're thinking.
Those things stay with me longer than they should.`,

`Small moments have a strange weight.
They pass quickly, but they linger somewhere in memory.
Maybe that's why they matter.`,

`There are words that stay unsaid.
Not because they aren't there,
but because they are quieter than the moment.`,

`Words have strange timing.
Sometimes they arrive too early.
Sometimes they arrive too late.
Sometimes they simply wait.`,

`I don't know what the future looks like.
But I know that certain moments stay.
Maybe that's enough for now.`
]

let pages=[]
let currentPage=0

function openBook(index){

let text=letters[index]

pages=text.match(/.{1,800}/g)

currentPage=0

document.getElementById("reader").style.display="flex"

showPage()

}

function showPage(){
document.getElementById("page").innerText=pages[currentPage]
}

function nextPage(){
if(currentPage<pages.length-1){
currentPage++
showPage()
}
}

function prevPage(){
if(currentPage>0){
currentPage--
showPage()
}
}

function closeBook(){
document.getElementById("reader").style.display="none"
}

</script>

</body>
</html>
