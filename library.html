<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title> Things I Never Said </title>

<style>

body{
margin:0;
font-family:Georgia,serif;
background:url("https://images.unsplash.com/photo-1521587760476-6c12a4b040da") center/cover fixed;
}

/* library area */

.library{
width:100%;
padding-top:60px;
}

/* shelves */

.shelf{
display:flex;
justify-content:center;
gap:6px;
margin:60px 0;
height:150px;
}

/* normal books */

.book{
width:40px;
height:160px;
border-radius:4px;
box-shadow:2px 2px 6px rgba(0,0,0,0.5);
}

/* color variations */

.red{background:linear-gradient(#7b2d2d,#3d1111);}
.green{background:linear-gradient(#355e3b,#1d3521);}
.blue{background:linear-gradient(#4b5d8a,#2d3c63);}
.brown{background:linear-gradient(#6b4423,#3d2612);}

/* special books */

.special{
width:45px;
background:linear-gradient(#9b5c2e,#4a2913);
color:white;
display:flex;
align-items:center;
justify-content:center;
writing-mode:vertical-rl;
text-orientation:mixed;
font-size:14px;
cursor:pointer;
transition:0.3s;
}

.special:hover{
transform:scale(1.05);
box-shadow:0 0 15px rgba(255,220,150,0.7);
}

/* book reader */

.reader{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:600px;
height:400px;
background:#fdf6e3;
box-shadow:0 0 25px rgba(0,0,0,0.7);
display:none;
flex-direction:column;
padding:30px;
border-radius:6px;
}

.page{
flex:1;
overflow:auto;
font-size:18px;
line-height:1.6;
}

.controls{
display:flex;
justify-content:space-between;
margin-top:15px;
}

button{
padding:8px 14px;
font-size:14px;
cursor:pointer;
border:none;
background:#6b4423;
color:white;
border-radius:4px;
}

button:hover{
background:#8a5a33;
}

.close{
position:absolute;
top:8px;
right:12px;
font-size:22px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="library">

<!-- Shelf 1 -->

<div class="shelf">

<div class="book red"></div>
<div class="book blue"></div>

<div class="book special" onclick="openBook(0)">Noticing</div>

<div class="book green"></div>
<div class="book brown"></div>
<div class="book blue"></div>

<div class="book special" onclick="openBook(1)">Small</div>

<div class="book red"></div>
<div class="book blue"></div>
<div class="book green"></div>
<div class="book brown"></div>

</div>

<!-- Shelf 2 -->

<div class="shelf">

<div class="book blue"></div>
<div class="book red"></div>

<div class="book special" onclick="openBook(2)">Unsai​d</div>

<div class="book green"></div>
<div class="book brown"></div>

<div class="book special" onclick="openBook(3)">Words</div>

<div class="book blue"></div>
<div class="book red"></div>
<div class="book green"></div>
<div class="book brown"></div>

</div>

<!-- Shelf 3 -->

<div class="shelf">

<div class="book green"></div>
<div class="book red"></div>

<div class="book special" onclick="openBook(4)">Future</div>

<div class="book blue"></div>
<div class="book brown"></div>
<div class="book red"></div>
<div class="book green"></div>
<div class="book blue"></div>

</div>

</div>

<!-- BOOK READER -->

<div class="reader" id="reader">

<div class="close" onclick="closeBook()">✕</div>

<div class="page" id="page"></div>

<div class="controls">
<button onclick="prevPage()">Previous</button>
<button onclick="nextPage()">Next</button>
</div>

</div>

<script>

let letters=[
<p>
            Sometimes I notice small things about you.<br>
            Like the way you add an extra emoji or a few letters so I don't start overthinking the thought that you're maybe upset. The way you pause before answering. The way you think. The way your eyes move when you're thinking. The way you portray your hands and body while talking. The way you cover your mouth while laughing. The way you eat just enough to fill your stomach but not as much that it makes you look bloated.
        </p>
        <p>
            The way you glance sideways when something makes you shy. The way you say "nothing" when something's clearly on your mind, hoping I'll ask again. The way your voice softens when you're tired, like you're letting me see a version of you you don't show everyone. The way you fidget with whatever's in your hands when you're nervous. The way you remember small details I mentioned once, months ago, and bring them up like they're important.
        </p>
        <p>
            The way you breathe differently when you're concentrating. The way you tilt your head when you're curious. The way you laugh at your own jokes before finishing them. The way you check your phone, put it down, then check it again like you're waiting for something—or someone. The way your mood shifts with the weather, with the time of day, with the song that's playing.
        </p>
        <p>
            The way you exist in a room changes the energy of it. And I notice. I always notice.
        </p>,

`Small moments have a strange weight.
They pass quickly, but they linger somewhere in memory. Like you calling me "Jaan" or "Love". Just 4 letter words, but I'm pretty sure I remember every single time you did..
Maybe that's why they matter. Because they're so small, but they build such a strong feeling that I wouldn't trade for anything ever`,

`There are words that stay unsaid. They sit in the space between heartbeats. In the seconds before sleep takes over. In the pause after you say something that makes the world stop.
Not because they aren't there, but because they are quieter than the moment. Like when you study until midnight, and I want to say "you amaze me" — but the word "proud" feels too small, and "in awe" feels too simple, and nothing captures the way my chest actually feels.
Or when she talks about our future, about annoying me and me annoying her back, and I want to say "I can't wait to live that with you" — but the excitement is too loud and the words get lost in the laughter.
These unsaid things aren't forgotten. They collect. They build. They become the weight behind every "I adore you" that actually makes it out.`,

`Words have strange timing. How every night, before sleep, there's this sentence I almost send. Something about how even the quiet days with you mean more than the loudest days without you. But I hold back, thinking it's too much, too soon, too something. So the words wait.
Sometimes they arrive too early. Sometimes they arrive too late. They waited through the site breaking and fixing. Through the hours you studied and I watched from afar. Through the future conversations where we mapped out a life together like we were drawing stars on a ceiling.
Sometimes they simply wait. And maybe the best ones ripen like fruit — untouchable until exactly the right season. Maybe when they finally arrive, whenever that is, they'll land softer, hit harder, mean more.`,

`I don't know what the future looks like — whether it's close or far, easy or hard, full of you or full of waiting.
But I know that certain moments stay — like the sound of your laugh when something actually hits, like the way you say my name, like the silence between us that never feels empty.
Maybe that's enough for now — maybe love isn't about knowing the ending, but about collecting moments that refuse to leave, about trusting that whatever comes next, these ones are already ours.

`
]

let pages=[]
let currentPage=0

function openBook(index){

let text=letters[index]

pages=text.match(/.{1,800}/g)

currentPage=0

document.getElementById("reader").style.display="flex"

showPage()

}

function showPage(){
document.getElementById("page").innerText=pages[currentPage]
}

function nextPage(){
if(currentPage<pages.length-1){
currentPage++
showPage()
}
}

function prevPage(){
if(currentPage>0){
currentPage--
showPage()
}
}

function closeBook(){
document.getElementById("reader").style.display="none"
}

</script>

</body>

</html>
