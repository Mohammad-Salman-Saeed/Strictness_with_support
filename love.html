oy your replies more than I enjoy writing these letters for you. (And I enjoy writing the letters a LOTTTTTT.)\n\nAnd then you got to know my reason. On why and how I got that sudden change in behaviour from before Jummah and after Jummah. (Emotional fr.)\n\nAnd afterwards — obviously — my permanent flirting. Which you have to listen to, feel, and deal with for the rest of your life 😁.\n\nBut damn jaan — your sleep is also getting affected now 😭. How did you go to sleep by 4 and not manage to sleep till 5? Didn't you wake up early?? But thankfully you did go to sleep, even if it was with a little frustration on me.\n\nI PROMISE, love — we'll spend hours and hours and hours together after your paper is finished. Neither will I sleep nor will you, okayyyy? But only until the 4th, please tolerate this 😭.\n\nBut well — you DID wake up!! You woke up at dot 10:15am. Although you did also fall asleep for another hour after that...... Buuuttttt since most of your studies are done and you're only revising now, that CAN be forgiven some some days 😅.\n\nWell jaan — now you've said you'll come back an hour late today. Instead of 12, you'll be coming back at 1. Which sucks 😭. But I was only joking when I said \"main apna mood kharab kardunga.\" I won't do that. I know what you have to do and I will let you do it.\n\n(Also — congrats to Warda for passing, Mashallah! IN SHA ALLAH, Manahil on 4th April, not only will she be giving me the passing news, but she will also be getting the highest marks ever with 82% IN SHA ALLAHHHHHH.)\n\nThese last 5 days are going to ask everything from you. Your focus. Your discipline. Your ability to push through when every part of you wants to stop. But here's the thing — you've already done the hard part. The hours are behind you. The foundation is built. All that's left is the final polish, the last revision, the quiet confidence of knowing you've done everything you could.\n\nWhen you sit with your books these next few days, don't think about what's left — think about what you've already done. 41 days. 41 letters. Countless hours. You've become someone who doesn't quit, who shows up, who fights even when fighting is hard. That person? She's ready.\n\nYou're so close. The finish line is right there. One last push, my love. Just one last push.\n\nI believe in you!!!!! 💗"

ind. You're not late.\n\nYou're right on time.\n\nAnd if you keep showing up like this?\n\n6 days from now — you'll walk out knowing you gave it everything.\n\nAnd that's exactly the kind of person who succeeds.\n\nI'm proud of youuuuuu 🤍"

ly play trying to catch someone off guard. And then bitching about him for a while hehe. Love bitching about men. #MenSuck.\n\nMmmm but then you started being a little possessive. Which, PLEASE DO MORE OF. That I keep rakhwali of someone else till 12 and then of you after 12. But in fact what I actually meant was that I was only talking about you, and that before 12 it's strict Salman that keeps watch and then after 12 it's me 😅😭. But whatever you understood, even if you got what I actually meant — BE POSSESSIVE ABOUT ME PUHLEAASSEEEEEE.\n\nAnd then came what you desperately wait for throughout the whole day — the letter. I'm kinda thinking... what will you wait for once this is over? 😭 Well still, I'm sure we'll come up with something... We always do.\n\nBut the letter tho — I honestly don't know what's happening jaan 😭. The letters seem to just be getting bigger and bigger!! It's like I write one, think that I possibly can't write more than this one any other day, then I write the next day and it already crosses it!!\n\nAnd then came the time for the real real surprise. Which, to be fair, you did do less time so I shouldn't just give it to you right. Well yesterday I kinda changed it up a bit — instead of playing a game for it or doing something for it, I asked you to give some love to me, and see if it's up to the mark and if it is then I will give it to you. But instead... You just had ANOTHER attackkkkkk 😭😭😭😭😭. Manahillll maaannnnn 😭.\n\nCould've just said that you're just not gonna give me love and that only I am gonna be giving it to you for life now, and that's kinda fixed I have figured by now. I wouldn't have asked you 😭. Because it does suck insanely bad that I ask and beg for it and still don't get anything — instead it returns to me giving love 😭.\n\nBut anyways, I did eventually send it to you. Our own dictionary. With every single word tailormade just for us. From A all the way to Z. And yes — this might just have been the best of the best thing I have ever made and showed till now. And that was visible by your reaction too. I'm saying it again and again but I really would've liked to have seen your reaction 😭. But thankfully that was able to distract you from that attack, and you returned back to being happy and loved.\n\nOoooooh you also got a glimpse of that thing hmmm??? 🤭 Don't worry, that's all you're getting. And yes, I'm going to be mentioning it here and there, so you stay excited for it and you lose your patience. Because I'm evil. MWAHAAHAHAHAHAHAHAHA.\n\nAnd yes... \"All eyes are on eye miss manahil 👀\"\n\nBut coming to today nowwww — another day, another great session of studies by you. I'm honestly confused how you're able to wake up everyday and study every damn day and not lose your head by now. Or maybe... you already have 😭.\n\nBut here's the thing about losing your head a little — sometimes it's exactly what you need. Sometimes the old you, the one who overthought everything and doubted herself and carried the weight of every bad day — sometimes that version needs to break a little so a stronger version can step forward. And that's what these 43 days have been. Not just studying. Becoming. Every morning you woke up when you didn't want to, every hour you sat with books when your body begged for rest, every time you chose your future over your comfort — you weren't just studying. You were becoming someone who doesn't break when things get hard.\n\n4 more days left. Just 4.\n\nYou've climbed the mountain. You've done the hard part. These last few days aren't about proving anything — they're about letting everything you've already built carry you home. Your body is tired. Your mind is exhausted. That's okay. That's the feeling of something ending. Of almost being there.\n\nDon't lose hope now, my love. Not when you're this close. Not when the finish line is right in front of you. Whatever happens in these next 4 days — whether you study 8 hours or 4, whether you wake up on time or sleep in, whether everything goes perfectly or nothing goes as planned — you're still going to walk into that exam hall as someone who gave everything they had.\n\nAnd that someone? She's already won.\n\n4 days. Just 4. Then you rest. Then you breathe. Then you're free.\n\nKeep going. I'm right here. Always have been. 💘"

hem. But do youuuuu???\n\nBut girl, omg — what was that convincing?? Were you trying to convince me or make me fall in love again? Either way, please keep doing it, omg that was the best. Didn't get to appreciate it enough because you were so desperately asking for the letter 😭.\n\nAND THEN — finally — came the letter.\n\nBefore that — pleaseeee jaaannnn, save some mental energy, just some 😭. Because you knowwww I'm gonna make you do somethingggg.\n\nBack to the letter — damn, yeah, you're right. It just keeps getting bigger and bigger. It IS a novel at this point 😭. And then your reply? An even more beautiful novel!!! In order to read your novels, I kinda just want to keep writing and yapping forever just so I can get more of YOUR writing. Your replies are honestly so beautiful. You don't fully understand. My lovergirl 🤭🥹🥹.\n\nBUT BUT BUT — the best convo happened before you were about to go to sleep omggggg. Yes. Whatever we talked about. Just. YES.\n\n8th December. That's all I'm gonna say.\n\nActually, no, nvm — that's not all I'm gonna say. I'm gonna talk about it in detail because OMG.\n\n8th June 2024 — second best day till now.\n\n8th June 2025 — worst day till now.\n\n8th February 2026 — best day of my life HELLO??\n\nAnd now — we have finalised. Because you love this date. So we have finalised — 8th December. AS OUR WEDDING DATE!!!!\n\nOMFG YAAAYYYYYYYYYY.\n\nOur wedding, Manahil. You and me. Manahil and Salman. 8th December. The rest of it — Allah will guide. But for now, we be happy with our lives and how it's playing out.\n\n(Yes, we are crazy.)\n\nNow onto today.\n\nYou woke up late again 😭. Right after waking up, you read such a massive story about what happened the previous day with me — while making something we both absolutely love to the sky and back. Very very fun. That's the kinda fun things that are gonna happen when we step into the kitchen together. Into OUR kitchen together.\n\nTwo more days, my love. Two more days of waking up to books. Two more days of this countdown. Two more days, and then the penultimate day followed by your exam, and then you're free. You've given everything to these past 2 nmonths. Every hour, every push, every moment of discipline — it's all been building toward this.\n\nYou're not going to wake up late on exam day. You're not going to freeze. You're not going to forget what you've studied. Because this version of you — the one who showed up day after day, who fought through headaches and tiredness and days when nothing felt possible — she doesn't crumble. She finishes. And she's about to finish beautifully.\n\nOne more push, Manahil. Just one more. Then we celebrate. Then we rest. Then we start counting down to December 8th🤭🤭.\n\nKeep going love. Just a little more. ❤️‍🔥"

hen the clock strikes 7:30pm all the way to your sleeping time at 5am hehehehe. You're all mine. Totally. Completely. Fully. Just mine. Nobody else's. And you also HAVE said that you ARE mine, always and forever, In Sha Allah. And with Allah's will, that status will never ever change.\n\nNow, onto the letter. Notice how Day 44's letter was a lot smaller than Day 43's? Hehe. I meant to do that. Because I wanted to end the last day with a bang rather than making the last two days very similar. So I made the penultimate day much smaller, so the ultimate finale is the greatest thing. You see how my freaking brain works in flash speed? I come up with all this for you and about you within seconds and minutes. I don't know what it is about your love, but it makes me always want to go above and beyond everything.\n\nLol, anything we do will surely be fun. We could just be sitting silently staring at the cloudy sky and still somehow make it fun by imagining shapes and figures drifting up above. But literal actual fun activities like spamming reels to each other IS indeed a pretty fun activity hehe.\n\nOoooh, well, just to let you know — you're not going to handle my physical flirting and my \"tharak\" at all 😭. It's nothing like my worded flirting — it's something else 😭. You are soooo not ready for it.\n\nThough I do miss asking you questions 😭. I haven't done so in a month, man. All because I didn't want to tire you out more than you already were. Because studying all day does take a massive toll on the brain, and then asking deep questions would just make it worse. Which I very evidently saw yesterday when I asked you to write a short note about me (5 marks) and you literally said your brain isn't working and it already made you sleepy 😭. HOW DOES ME ASKING A QUESTION TO DESCRIBE ME MAKE YOU SLEEPY 😭😭. But anyways, stay ready for after the exam, because you're getting a month's worth of things to answer, and no excuses will be accepted MWAHAHAHAAHHA... (please 😭).\n\nYes, wn. I feel so bad for you whenever something like this happens. But for a very peaceful, successful, and complete future with both of us together, this step has to be taken, my love. For us. Hopefully you're studying well.\n\n---\n\nAnd now — this is it. The last one.\n\n45 days ago, I started writing letters to someone who was about to begin something hard. Someone who doubted herself, who didn't know if she could do it, who needed a push. And look at you now. Look at who you've become.\n\nYou didn't just study for an exam, Manahil. You built something. Discipline. Strength. Proof that you can do hard things. Proof that when you set your mind to something, nothing — not headaches, not tiredness, not anxiety, not days that felt impossible — nothing can stop you.\n\nI watched you do it. Every single day. I watched you fall and get back up. I watched you miss days and then crush the next ones. I watched you fight through laziness and exhaustion and moments when every part of you wanted to quit. And you didn't. You never did.\n\nDo you understand what that means? You're not the same person who started this journey. That person was scared. Afraid. Hesitant. This person? This person is ready. This person is going to walk into that exam hall on Saturday and show them exactly what she's made of.\n\nAnd I'll be there. Not in the room, but in your heart. In your mind. In every answer you write, in every moment you pause and remember that someone believes in you so completely it's almost embarrassing. I'll be there, cheering louder than anyone.\n\nThese 45 letters — they're yours. Every word, every thought, every moment I spent writing them — they were for you. To remind you that you're capable. To remind you that you're loved. To remind you that no matter what happens on Saturday, you've already won. Because you showed up. Because you tried. Because you became someone who doesn't quit.\n\nAnd me? I fell. Every single day. A little more. Until there was nothing left to fall — // Track unlocked days
let unlockedDays = JSON.parse(localStorage.getItem('unlockedLetters')) || [];

function unlock() {
    const input = document.getElementById('password').value.trim().toLowerCase();
    const errorDiv = document.getElementById('error');
    
    // Clear previous error
    errorDiv.innerText = '';
    
    // Find the NEXT UNLOCKED DAY by scanning from day 1 onward
    let nextDay = unlockedDays.length + 1;
    
    // Check if the input matches the password for the next day
    if (nextDay <= dayPasswords.length && dayPasswords[nextDay - 1] === input) {
        // Correct! It's the next day's password
        unlockedDays.push(nextDay);
        localStorage.setItem('unlockedLetters', JSON.stringify(unlockedDays));
        errorDiv.innerText = '✅ Letter unlocked!';
        errorDiv.style.color = '#4CAF50';
    } else {
        // Wrong password
        errorDiv.innerText = '❌ Wrong password';
        errorDiv.style.color = '#ff6b6b';
    }
    
    displayLetters();
    document.getElementById('password').value = '';
}

        letterDiv.className = `letter ${isUnlocked ? 'unlocked' : ''}`;
        
        if (isUnlocked) {
            letterDiv.innerHTML = `
                <div class="letter-day">DAY ${day}</div>
                <div class="letter-title">${letter.title}</div>
                <div class="letter-content">${letter.content}</div>
            `;
        } else {
            letterDiv.innerHTML = `
                <div class="letter-day">DAY ${day}</div>
                <div class="locked-message">🔒 locked</div>
            `;
        }
        
        container.appendChild(letterDiv);
    }
    
    progress.innerHTML = `📬 ${unlockedDays.length} of 45 letters unlocked`;
    
    // Show next password hint
    if (unlockedDays.length < 45) {
        const nextDay = unlockedDays.length + 1;
        nextHint.innerHTML = `✨ next password unlocks day ${nextDay}`;
    } else {
        nextHint.innerHTML = '✨ all letters unlocked! 💕';
    }
    
    // Scroll to newest letter
    if (unlockedDays.length > 0) {
        const newest = Math.max(...unlockedDays) - 1;
        document.querySelectorAll('.letter')[newest]?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
}

// Clear password field and display on load
document.getElementById('password').value = '';
displayLetters();
</script>
</body>
</html>
