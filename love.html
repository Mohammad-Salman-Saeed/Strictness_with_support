// Track unlocked days
let unlockedDays = JSON.parse(localStorage.getItem('unlockedLetters')) || [];

function unlock() {
    const input = document.getElementById('password').value.trim().toLowerCase();
    const errorDiv = document.getElementById('error');
    
    // Clear previous error
    errorDiv.innerText = '';
    
    // Find the NEXT UNLOCKED DAY by scanning from day 1 onward
    let nextDay = unlockedDays.length + 1;
    
    // Check if the input matches the password for the next day
    if (nextDay <= dayPasswords.length && dayPasswords[nextDay - 1] === input) {
        // Correct! It's the next day's password
        unlockedDays.push(nextDay);
        localStorage.setItem('unlockedLetters', JSON.stringify(unlockedDays));
        errorDiv.innerText = '✅ Letter unlocked!';
        errorDiv.style.color = '#4CAF50';
    } else {
        // Wrong password
        errorDiv.innerText = '❌ Wrong password';
        errorDiv.style.color = '#ff6b6b';
    }
    
    displayLetters();
    document.getElementById('password').value = '';
}

function displayLetters() {
    const container = document.getElementById('lettersContainer');
    const progress = document.getElementById('progress');
    const nextHint = document.getElementById('nextHint');
    
    container.innerHTML = '';
    
    for (let i = 0; i < letters.length; i++) {
        const day = i + 1;
        const letter = letters[i];
        const isUnlocked = unlockedDays.includes(day);
        
        const letterDiv = document.createElement('div');
        letterDiv.className = `letter ${isUnlocked ? 'unlocked' : ''}`;
        
        if (isUnlocked) {
            letterDiv.innerHTML = `
                <div class="letter-day">DAY ${day}</div>
                <div class="letter-title">${letter.title}</div>
                <div class="letter-content">${letter.content}</div>
            `;
        } else {
            letterDiv.innerHTML = `
                <div class="letter-day">DAY ${day}</div>
                <div class="locked-message">🔒 locked</div>
            `;
        }
        
        container.appendChild(letterDiv);
    }
    
    progress.innerHTML = `📬 ${unlockedDays.length} of 45 letters unlocked`;
    
    // Show next password hint
    if (unlockedDays.length < 45) {
        const nextDay = unlockedDays.length + 1;
        nextHint.innerHTML = `✨ next password unlocks day ${nextDay}`;
    } else {
        nextHint.innerHTML = '✨ all letters unlocked! 💕';
    }
    
    // Scroll to newest letter
    if (unlockedDays.length > 0) {
        const newest = Math.max(...unlockedDays) - 1;
        document.querySelectorAll('.letter')[newest]?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
}

// Clear password field and display on load
document.getElementById('password').value = '';
displayLetters();
