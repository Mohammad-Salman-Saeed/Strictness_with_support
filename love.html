<!DOCTYPE html>
<html>
<head>
<title>💌 love letters</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
background:linear-gradient(135deg, #2c1810, #4a2c1a);
font-family:'Georgia', serif;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
margin:0;
padding:20px;
color:#f5e6d3;
}
.container {
max-width:600px;
width:100%;
background:rgba(255,255,240,0.1);
backdrop-filter:blur(10px);
border-radius:40px;
padding:30px;
text-align:center;
border:2px solid #d4af37;
}
h1 {
font-size:32px;
letter-spacing:3px;
color:#d4af37;
}
.password-area {
margin:30px 0;
}
input {
padding:15px;
font-size:18px;
border-radius:50px;
border:none;
text-align:center;
width:70%;
background:rgba(255,255,255,0.9);
}
button {
padding:15px 30px;
font-size:18px;
border-radius:50px;
border:none;
background:#d4af37;
color:#2c1810;
font-weight:bold;
margin-left:10px;
cursor:pointer;
transition:0.3s;
}
button:hover {
transform:scale(1.05);
box-shadow:0 0 30px gold;
}
.letters-container {
margin-top:30px;
max-height:500px;
overflow-y:auto;
padding-right:10px;
}
.letter {
background:rgba(255,255,240,0.15);
border-left:5px solid #d4af37;
border-radius:20px;
padding:20px;
margin:20px 0;
text-align:left;
opacity:0.3;
filter:blur(2px);
transition:0.5s;
}
.letter.unlocked {
opacity:1;
filter:blur(0);
}
.letter-day {
color:#d4af37;
font-size:14px;
margin-bottom:10px;
}
.letter-title {
font-size:20px;
font-weight:bold;
margin-bottom:15px;
color:white;
}
.letter-content {
font-size:16px;
line-height:1.8;
white-space:pre-line;
}
.locked-message {
color:rgba(255,255,255,0.3);
font-style:italic;
}
.progress {
margin-top:20px;
color:#d4af37;
font-size:18px;
}
.next-hint {
color:rgba(255,255,255,0.5);
font-size:14px;
margin-top:10px;
font-style:italic;
}
.error-message {
color:#ff6b6b;
margin-top:10px;
min-height:20px;
font-size:14px;
}
</style>
</head>
<body>

<div class="container">
    <h1>💌 LOVE LETTERS</h1>
    <p>a new letter unlocks each day</p>
    
    <div class="password-area">
        <input id="password" placeholder="enter today's code" type="password">
        <button onclick="unlock()">unlock</button>
    </div>
    
    <div id="error" class="error-message"></div>
    <div id="progress" class="progress">📬 0 of 45 letters unlocked</div>
    <div id="nextHint" class="next-hint"></div>
    
    <div class="letters-container" id="lettersContainer"></div>
</div>

<script>
// =============================================
// DAY PASSWORDS - 45 days
// =============================================
const dayPasswords = [
    "you", "exist", "in", "my", "thoughts", "every", "single", "day", "and", "night",
    "without", "trying", "you", "became", "my", "favourite", "habit", "the", "one", "i",
    "think", "of", "when", "i", "wake", "and", "the", "last", "before", "i",
    "sleep", "you're", "my", "calm", "my", "storm", "my", "reason", "to", "feel",
    "this", "way", "manahil", "always", "you"
];

// =============================================
// LOVE LETTERS - 45 Days (SIMPLIFIED FOR TESTING)
// =============================================
const letters = [
    { title: "Day 1", content: "Letter 1" },
    { title: "Day 2", content: "Letter 2" },
    { title: "Day 3", content: "Letter 3" },
    { title: "Day 4", content: "Letter 4" },
    { title: "Day 5", content: "Letter 5" },
    { title: "Day 6", content: "Letter 6" },
    { title: "Day 7", content: "Letter 7" },
    { title: "Day 8", content: "Letter 8" },
    { title: "Day 9", content: "Letter 9" },
    { title: "Day 10", content: "Letter 10" },
    { title: "Day 11", content: "Letter 11" },
    { title: "Day 12", content: "Letter 12" },
    { title: "Day 13", content: "Letter 13" },
    { title: "Day 14", content: "Letter 14" },
    { title: "Day 15", content: "Letter 15" },
    { title: "Day 16", content: "Letter 16" },
    { title: "Day 17", content: "Letter 17" },
    { title: "Day 18", content: "Letter 18" },
    { title: "Day 19", content: "Letter 19" },
    { title: "Day 20", content: "Letter 20" },
    { title: "Day 21", content: "Letter 21" },
    { title: "Day 22", content: "Letter 22" },
    { title: "Day 23", content: "Letter 23" },
    { title: "Day 24", content: "Letter 24" },
    { title: "Day 25", content: "Letter 25" },
    { title: "Day 26", content: "Letter 26" },
    { title: "Day 27", content: "Letter 27" },
    { title: "Day 28", content: "Letter 28" },
    { title: "Day 29", content: "Letter 29" },
    { title: "Day 30", content: "Letter 30" },
    { title: "Day 31", content: "Letter 31" },
    { title: "Day 32", content: "Letter 32" },
    { title: "Day 33", content: "Letter 33" },
    { title: "Day 34", content: "Letter 34" },
    { title: "Day 35", content: "Letter 35" },
    { title: "Day 36", content: "Letter 36" },
    { title: "Day 37", content: "Letter 37" },
    { title: "Day 38", content: "Letter 38" },
    { title: "Day 39", content: "Letter 39" },
    { title: "Day 40", content: "Letter 40" },
    { title: "Day 41", content: "Letter 41" },
    { title: "Day 42", content: "Letter 42" },
    { title: "Day 43", content: "Letter 43" },
    { title: "Day 44", content: "Letter 44" },
    { title: "Day 45", content: "Letter 45" }
];

// Track unlocked days
let unlockedDays = JSON.parse(localStorage.getItem('unlockedLetters')) || [];

function unlock() {
    const input = document.getElementById('password').value.trim().toLowerCase();
    const errorDiv = document.getElementById('error');
    
    errorDiv.innerText = '';
    
    let nextDay = unlockedDays.length + 1;
    
    if (nextDay <= dayPasswords.length && dayPasswords[nextDay - 1] === input) {
        unlockedDays.push(nextDay);
        localStorage.setItem('unlockedLetters', JSON.stringify(unlockedDays));
        errorDiv.innerText = '✅ Letter unlocked!';
        errorDiv.style.color = '#4CAF50';
    } else {
        errorDiv.innerText = '❌ Wrong password';
        errorDiv.style.color = '#ff6b6b';
    }
    
    displayLetters();
    document.getElementById('password').value = '';
}

function displayLetters() {
    const container = document.getElementById('lettersContainer');
    const progress = document.getElementById('progress');
    const nextHint = document.getElementById('nextHint');
    
    container.innerHTML = '';
    
    for (let i = 0; i < letters.length; i++) {
        const day = i + 1;
        const letter = letters[i];
        const isUnlocked = unlockedDays.includes(day);
        
        const letterDiv = document.createElement('div');
        letterDiv.className = `letter ${isUnlocked ? 'unlocked' : ''}`;
        
        if (isUnlocked) {
            letterDiv.innerHTML = `
                <div class="letter-day">DAY ${day}</div>
                <div class="letter-title">${letter.title}</div>
                <div class="letter-content">${letter.content}</div>
            `;
        } else {
            letterDiv.innerHTML = `
                <div class="letter-day">DAY ${day}</div>
                <div class="locked-message">🔒 locked</div>
            `;
        }
        
        container.appendChild(letterDiv);
    }
    
    progress.innerHTML = `📬 ${unlockedDays.length} of 45 letters unlocked`;
    
    if (unlockedDays.length < 45) {
        const nextDay = unlockedDays.length + 1;
        nextHint.innerHTML = `✨ next password unlocks day ${nextDay}`;
    } else {
        nextHint.innerHTML = '✨ all letters unlocked! 💕';
    }
}

displayLetters();
</script>
</body>
</html>
