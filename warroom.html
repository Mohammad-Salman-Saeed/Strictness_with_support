<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FMA War Room – Archive Edition</title>

<style>
body{
margin:0;
font-family: 'Segoe UI', sans-serif;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
text-align:center;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

h1{
margin-top:20px;
letter-spacing:2px;
text-shadow:0 0 10px rgba(255,255,255,0.3);
}

.subtitle{
color:#a8dadc;
font-style:italic;
margin-bottom:30px;
}

.card{
background:rgba(255,255,255,0.07);
padding:20px;
margin:20px 0;
border-radius:20px;
backdrop-filter:blur(10px);
box-shadow:0 0 20px rgba(0,0,0,0.4);
border-left:4px solid #ff416c;
}

.section-title{
color:#ffb6c1;
letter-spacing:1px;
margin-bottom:15px;
}

.progress-container{
background:rgba(255,255,255,0.1);
border-radius:50px;
overflow:hidden;
margin-top:10px;
}

.progress-bar{
height:20px;
width:0%;
background:linear-gradient(90deg,#ff416c,#ff4b2b);
transition:1s;
box-shadow:0 0 20px #ff416c;
}

button{
padding:12px 20px;
margin:8px;
border:none;
border-radius:30px;
cursor:pointer;
background:linear-gradient(90deg,#ff416c,#ff4b2b);
color:white;
font-size:14px;
font-weight:bold;
transition:0.3s;
-webkit-tap-highlight-color:transparent;
}

button:hover{
transform:scale(1.05);
box-shadow:0 0 20px #ff416c;
}

button:active{
transform:scale(0.95);
}

.diary-entry{
margin:15px 0;
padding:20px;
background:rgba(255,255,255,0.05);
border-radius:15px;
text-align:left;
border-left:3px solid #ffb6c1;
word-wrap:break-word;
}

.locked{
opacity:0.3;
filter:blur(3px);
font-style:italic;
color:#a8dadc;
}

.unlock-anim{
animation:fadeIn 1s ease forwards;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

.achievement-badge{
display:inline-block;
padding:8px 15px;
margin:5px;
background:rgba(255,215,0,0.2);
border:1px solid gold;
border-radius:30px;
font-size:12px;
}

.secret-message{
background:rgba(255,105,180,0.2);
border:2px solid #ff69b4;
padding:20px;
border-radius:20px;
margin:20px 0;
font-size:18px;
line-height:1.8;
text-align:center;
animation:glow 2s infinite;
}

@keyframes glow{
0%{box-shadow:0 0 10px #ff69b4;}
50%{box-shadow:0 0 30px #ff69b4;}
100%{box-shadow:0 0 10px #ff69b4;}
}

.streak-badge{
background:#ff416c;
color:white;
padding:5px 15px;
border-radius:30px;
display:inline-block;
margin:10px 0;
}

.secret-badge{
background:gold;
color:black;
padding:5px 10px;
border-radius:30px;
font-size:12px;
font-weight:bold;
cursor:pointer;
}

.achievements-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:10px;
margin:15px 0;
}

/* Mobile optimizations */
@media (max-width:480px){
button{
padding:15px 25px;
font-size:16px;
width:100%;
margin:5px 0;
}
.diary-entry{
padding:15px;
font-size:14px;
}
}
</style>
</head>

<body>
<div class="container">

<h1>FMA WAR ROOM</h1>
<div class="subtitle">every hour brings you closer to the story</div>

<!-- SECTION 1: PERFORMANCE TRACKER -->
<div class="card">
<h2 class="section-title">⏳ study tracker</h2>
<div id="scoreDisplay" style="font-size:32px; font-weight:bold;">0 / 100</div>

<div class="progress-container">
<div class="progress-bar" id="progressBar"></div>
</div>

<div style="margin:15px 0;">
<span class="streak-badge" id="streakDisplay">streak: 0 days</span>
</div>

<div>
<button onclick="addHours(5)">📚 +5 hours (3 pts)</button>
<button onclick="addHours(7)">🔥 +7 hours (5 pts)</button>
</div>

<div style="margin-top:15px; font-size:14px; color:#a8dadc;">
✨ reach 100 points to unlock full diary ✨
</div>
</div>

<!-- SECTION 2: DIARY VAULT -->
<div class="card">
<h2 class="section-title">📖 diary vault</h2>
<div id="diaryContainer"></div>
</div>

<!-- SECTION 3: ACHIEVEMENTS + SECRET MESSAGES -->
<div class="card">
<h2 class="section-title">🏆 achievements & secrets</h2>
<div id="achievementsContainer" class="achievements-grid"></div>
<div id="secretMessageContainer"></div>
</div>

</div>

<script>

// =========================
// INITIALIZE STORAGE
// =========================
let score = localStorage.getItem("score") ? parseInt(localStorage.getItem("score")) : 0;
let streak = localStorage.getItem("streak") ? parseInt(localStorage.getItem("streak")) : 0;
let lastUpdate = localStorage.getItem("lastUpdate") ? localStorage.getItem("lastUpdate") : null;
let unlockedParagraphs = localStorage.getItem("unlocked") ? JSON.parse(localStorage.getItem("unlocked")) : {};
let achievements = localStorage.getItem("achievements") ? JSON.parse(localStorage.getItem("achievements")) : [];
let secretUnlocked = localStorage.getItem("secretUnlocked") ? parseInt(localStorage.getItem("secretUnlocked")) : 0;
let lastUnlockedDay = localStorage.getItem("lastUnlockedDay") ? parseInt(localStorage.getItem("lastUnlockedDay")) : 1;

// =========================
// ✍️ YOUR DIARIES (DAYS 1-30) - ONLY DAYS 1-2 FILLED, REST EMPTY FOR YOU
// =========================
const diaries = {
    1: `First day. Damn girl, you're really making my creativity run so fucking free to be making all these ideas.😭 Today was strange in a quiet way. The kind of day where the sky looks normal but something inside feels slightly off. I think I carried a little storm from my world into ours… and I didn’t even realise it at first. 🌫️

You kept asking what was wrong, and instead of just saying “I’m annoyed about something else,” I started overthinking us. Classic me. I questioned things that never even needed questioning. Whether I talk too much. Whether my “meri jaan” and “love” and “jaan” might one day annoy you. Meanwhile you were just… being you. Calm. Patient. Steady. 🤍

The funny part? You didn’t get tired of my yapping. You didn’t roll your eyes at the nicknames. You didn’t say I was too much. You just said you enjoy it. And that your expressiveness has grown — and honestly, it has. I’ve seen it. Even if sometimes I pretend I don’t. 😌

I hate that my mood spilled over and touched yours. That wasn’t fair. You didn’t deserve the cold version of me this morning. But even in that, you stayed. You listened. And that says more than dramatic goodnight paragraphs ever could.

If anything, today reminded me of something important — we’re not perfect, but we’re real. And even on slightly messy mornings… I still choose you. Even when I’m grumpy. Even when I overthink. Even when I forget to add emojis. ❤️`,

    2: `Some days love is loud. Some days it’s just two people trying not to misunderstand each other. Today felt like that — like we were both holding delicate glass but scared to drop it. 🤍

I think sometimes I love so loudly that it sounds like pressure. And you love so softly that I mistake it for silence. But the truth? Neither of us is wrong. We’re just different shades of the same feeling.

When you said you try, I realized something — I never wanted you to change. I just wanted to feel close. I just wanted to feel important, and that I mattered too other than just the words "You matter." But the truth is, you were close the whole time. I was just overthinking the distance.

The best part? We fixed it. Not dramatically. Not perfectly. Just honestly. And somehow that felt more real than any perfect day ever could. 🌙`,

    3: `Day 3. What a day it's been.

You know those random question games we play? The ones where I just keep asking and asking, and you somehow still answer with that little excitement in your voice when we start? I love those. And I know you do too — I can feel it. But I also knowwwww, that they take a lot out of you. All that mental energy, all those deep dives into feelings and thoughts — it's a lot. And today, even though it was your day, even though you weren't distracted by anything at all and gave your whole self to Manahil and her studies, you still showed up for those questions. That matters to me. More than you know.

(But also, they're so nice naaaa? Like the conversations they bring out?😭 Chef's kiss. Still, I hear you. I'll try to keep them within bearable limits. Loll.)

And then there's this other thing — you told me you read our chats. From the very first good morning to the last good night. Thirteen hours of us, and you go back through them. Almost every day. Manahil, that's not something everyone does. That's something only someone who really, really treasures someone does. Reading our old chats, visiting your garden every single day, they don't just hint it, they scream of love.

And then we talked about the old days — when we had no direct way to talk, so we wrote on Instagram stories. Leaving words for each other in places no one else thought to look. That was us. Finding a way back to each other. Always.

And today? NINE hours of studying. Nine. When you usually do five. You didn't just study today — you poured yourself into it. That's not effort, that's fire. That's you deciding your dreams are worth it. And they are. They're worth everything.

You made me fall even deeper today. Just by being exactly who you are.

I'm so incredibly proud of you, my love. 💕`, // Filled
    4: ``, // Empty - you'll fill
    5: ``, // Empty - you'll fill
    6: ``, // Empty - you'll fill
    7: ``, // Empty - you'll fill
    8: ``, // Empty - you'll fill
    9: ``, // Empty - you'll fill
    10: ``, // Empty - you'll fill
    11: ``, // Empty - you'll fill
    12: ``, // Empty - you'll fill
    13: ``, // Empty - you'll fill
    14: ``, // Empty - you'll fill
    15: ``, // Empty - you'll fill
    16: ``, // Empty - you'll fill
    17: ``, // Empty - you'll fill
    18: ``, // Empty - you'll fill
    19: ``, // Empty - you'll fill
    20: ``, // Empty - you'll fill
    21: ``, // Empty - you'll fill
    22: ``, // Empty - you'll fill
    23: ``, // Empty - you'll fill
    24: ``, // Empty - you'll fill
    25: ``, // Empty - you'll fill
    26: ``, // Empty - you'll fill
    27: ``, // Empty - you'll fill
    28: ``, // Empty - you'll fill
    29: ``, // Empty - you'll fill
    30: ``, // Empty - you'll fill
};

// =========================
// 🤫 SECRET MESSAGES (English text, romantic Urdu meaning)
// =========================
const secretMessages = [
    "Meri zindagi ho tum jaan.",
    "Tumhare bina mera dil hai veeran.",
    "Meri aakhon ka noor ho tum.",
    "Dil me basi ho tum mere.",
    "Tum meri zindagi ka woh na-mukammal hissa ho.",
    "Tum mere khwabo ki malka ho.",
    "Mere har din ki shuruwat sirf tumse hai.",
    "Mere sukoon ki nishani ho tum.",
    "Tum se mere dil ko milta hai sukoon.",
    "Meri zindagi ka bohot ehm hissa ho tum."
];

// =========================
// ACHIEVEMENTS
// =========================
const achievementList = [
    { id: 1, name: "First Step", desc: "Unlocked first diary", emoji: "🌱", threshold: 10 },
    { id: 2, name: "Getting There", desc: "25 points reached", emoji: "🌿", threshold: 25 },
    { id: 3, name: "Halfway", desc: "50 points reached", emoji: "🌲", threshold: 50 },
    { id: 4, name: "Dedicated", desc: "75 points reached", emoji: "🔥", threshold: 75 },
    { id: 5, name: "Full Access", desc: "Unlocked all diaries", emoji: "👑", threshold: 100 },
    { id: 6, name: "Secret Finder", desc: "Found a hidden message", emoji: "✨", threshold: "secret" }
];

// =========================
// FUNCTIONS
// =========================
function save(){
    localStorage.setItem("score", score);
    localStorage.setItem("streak", streak);
    localStorage.setItem("lastUpdate", new Date().toDateString());
    localStorage.setItem("unlocked", JSON.stringify(unlockedParagraphs));
    localStorage.setItem("achievements", JSON.stringify(achievements));
    localStorage.setItem("secretUnlocked", secretUnlocked);
    localStorage.setItem("lastUnlockedDay", lastUnlockedDay);
}

function checkStreak(){
    let today = new Date().toDateString();
    if(lastUpdate && lastUpdate !== today){
        let yesterday = new Date();
        yesterday.setDate(yesterday.getDate()-1);
        if(lastUpdate === yesterday.toDateString()){
            // streak continues
        } else {
            streak = 0;
            lastUnlockedDay = 1; // Reset to day 1 if streak broken
        }
    }
    lastUpdate = today;
}

function updateUI(){
    checkStreak();
    document.getElementById("scoreDisplay").innerText = score + " / 100";
    document.getElementById("streakDisplay").innerText = "streak: " + streak + " days";
    document.getElementById("progressBar").style.width = score + "%";
    
    checkAchievements();
    renderDiary();
    renderAchievements();
    renderSecretMessages();
}

function addHours(hours){
    let points = hours === 7 ? 5 : 3;
    score += points;
    if(score > 100) score = 100;
    
    streak++;
    
    unlockNextParagraph(); // Changed to unlock in order
    
    save();
    updateUI();
}

// NEW FUNCTION: Unlocks paragraphs in order day by day
function unlockNextParagraph(){
    // Find the current day we're working on
    let currentDay = 1;
    
    // Loop through days to find which day we're on
    for(let day = 1; day <= 30; day++){
        if(!diaries[day] || diaries[day].trim() === "") continue; // Skip empty days
        
        let paragraphs = diaries[day].split(/\n\s*\n/).filter(p => p.trim() != "");
        if(paragraphs.length === 0) continue;
        
        if(!unlockedParagraphs[day]){
            unlockedParagraphs[day] = [];
        }
        
        // If this day still has locked paragraphs, this is our current day
        if(unlockedParagraphs[day].length < paragraphs.length){
            currentDay = day;
            break;
        }
    }
    
    // Now unlock a random paragraph from currentDay
    let day = currentDay;
    let paragraphs = diaries[day].split(/\n\s*\n/).filter(p => p.trim() != "");
    
    if(!unlockedParagraphs[day]){
        unlockedParagraphs[day] = [];
    }
    
    // If all paragraphs for this day are already unlocked, move to next day
    if(unlockedParagraphs[day].length >= paragraphs.length){
        // Find next day with content
        for(let nextDay = day + 1; nextDay <= 30; nextDay++){
            if(!diaries[nextDay] || diaries[nextDay].trim() === "") continue;
            let nextParagraphs = diaries[nextDay].split(/\n\s*\n/).filter(p => p.trim() != "");
            if(nextParagraphs.length > 0){
                day = nextDay;
                paragraphs = nextParagraphs;
                if(!unlockedParagraphs[day]){
                    unlockedParagraphs[day] = [];
                }
                break;
            }
        }
    }
    
    // Get locked paragraph indexes for this day
    let lockedIndexes = [];
    for(let i = 0; i < paragraphs.length; i++){
        if(!unlockedParagraphs[day].includes(i)){
            lockedIndexes.push(i);
        }
    }
    
    // If there are locked paragraphs, unlock a random one
    if(lockedIndexes.length > 0){
        let randomIndex = lockedIndexes[Math.floor(Math.random() * lockedIndexes.length)];
        unlockedParagraphs[day].push(randomIndex);
        
        // Sort to keep them organized
        unlockedParagraphs[day].sort((a,b) => a - b);
    }
}

function checkAchievements(){
    let newAchievements = [];
    
    achievementList.forEach(ach => {
        if(ach.id === 6) return; // Handle secret separately
        
        if(score >= ach.threshold && !achievements.includes(ach.id)){
            newAchievements.push(ach.id);
            achievements.push(ach.id);
        }
    });
    
    // Check for secret achievement (streak 7+)
    if(streak >= 7 && !achievements.includes(6)){
        achievements.push(6);
        newAchievements.push(6);
        secretUnlocked = Math.min(secretUnlocked + 1, secretMessages.length);
    }
    
    if(newAchievements.length > 0){
        alert("🏆 New achievement unlocked!");
    }
}

function renderDiary(){
    let container = document.getElementById("diaryContainer");
    container.innerHTML = "";
    
    for(let day = 1; day <= 30; day++){
        if(!diaries[day] || diaries[day].trim() === "") continue; // Skip empty days
        
        let entryDiv = document.createElement("div");
        entryDiv.className = "diary-entry";
        
        let title = "<strong>📅 Day " + day + "</strong><br><br>";
        
        let paragraphs = diaries[day].split(/\n\s*\n/).filter(p => p.trim() != "");
        
        if(score >= 100){
            // Full access mode
            entryDiv.innerHTML = title + paragraphs.join("<br><br>");
            entryDiv.classList.add("unlock-anim");
        } else {
            // Locked mode - show in order
            let content = "";
            
            for(let i = 0; i < paragraphs.length; i++){
                if(unlockedParagraphs[day] && unlockedParagraphs[day].includes(i)){
                    content += paragraphs[i] + "<br><br>";
                } else {
                    content += "<span class='locked'>🔒 locked paragraph</span><br><br>";
                }
            }
            
            entryDiv.innerHTML = title + content;
        }
        
        container.appendChild(entryDiv);
    }
}

function renderAchievements(){
    let container = document.getElementById("achievementsContainer");
    container.innerHTML = "";
    
    achievementList.forEach(ach => {
        if(ach.id === 6) return; // Handle separately
        
        let achieved = achievements.includes(ach.id);
        
        let badge = document.createElement("div");
        badge.className = "achievement-badge";
        badge.style.background = achieved ? "rgba(255,215,0,0.3)" : "rgba(255,255,255,0.05)";
        badge.style.borderColor = achieved ? "gold" : "#666";
        badge.style.opacity = achieved ? "1" : "0.5";
        
        badge.innerHTML = `${ach.emoji} ${ach.name}`;
        
        if(!achieved){
            badge.innerHTML += `<br><span style="font-size:10px;">${ach.threshold} pts</span>`;
        }
        
        container.appendChild(badge);
    });
}

function renderSecretMessages(){
    let container = document.getElementById("secretMessageContainer");
    container.innerHTML = "";
    
    if(achievements.includes(6)){
        for(let i = 0; i < secretUnlocked; i++){
            let msgDiv = document.createElement("div");
            msgDiv.className = "secret-message";
            msgDiv.innerHTML = `✨ ${secretMessages[i]} ✨`;
            container.appendChild(msgDiv);
        }
        
        if(secretUnlocked < secretMessages.length){
            let hint = document.createElement("div");
            hint.style.marginTop = "10px";
            hint.style.fontSize = "12px";
            hint.style.color = "#ffb6c1";
            hint.innerText = "✨ keep studying to unlock more secrets ✨";
            container.appendChild(hint);
        }
    } else {
        let secretBadge = document.createElement("div");
        secretBadge.className = "secret-badge";
        secretBadge.onclick = function(){
            alert("🤫 Keep your streak alive to unlock hidden messages...");
        };
        secretBadge.innerText = "🤫 secret locked";
        container.appendChild(secretBadge);
    }
}

// Initialize
updateUI();
</script>
</body>
</html>
